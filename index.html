<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英文學習資料庫</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 12px; color: #333; display: flex; justify-content: center; }
    .container { max-width: 480px; width: 100%; background: #fff; padding: 20px; border-radius: 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.05); text-align: center; }
    
    h1 { font-size: 22px; color: #1e293b; margin-top: 5px; margin-bottom: 15px; display: flex; justify-content: center; align-items: center; gap: 8px; }
    
    /* 模式分頁按鈕 */
    .tab-group { display: flex; gap: 12px; margin-bottom: 15px; }
    .tab-btn { flex: 1; padding: 10px; font-size: 15px; font-weight: bold; border: 2px solid #2563eb; background: #fff; color: #2563eb; border-radius: 10px; cursor: pointer; transition: all 0.2s; }
    .tab-btn.active { background: #2563eb; color: #fff; }

    /* 頂部篩選與搜尋 */
    .filter-box { background: #edf2f7; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
    .filter-row { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
    .filter-label { font-size: 14px; font-weight: bold; color: #1e3a8a; white-space: nowrap; }
    select, .search-input { padding: 6px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; background: #fff; width: 100%; max-width: 220px; font-weight: bold; }
    
    /* 排序與計數列 */
    .tool-bar { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; padding: 0 4px; }
    .tool-row-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .info-text { font-size: 13px; color: #64748b; font-weight: bold; }
    
    /* 高級排序按鈕群 */
    .sort-grid { display: flex; flex-wrap: wrap; gap: 4px; width: 100%; justify-content: flex-start; }
    .sort-btn { padding: 4px 8px; font-size: 11px; font-weight: bold; border: 1px solid #cbd5e1; background: #fff; border-radius: 6px; cursor: pointer; color: #475569; }
    .sort-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }

    /* 顯示模式切換 */
    .mode-group { display: flex; justify-content: center; gap: 8px; margin-bottom: 15px; }
    .mode-btn { flex: 1; max-width: 75px; padding: 8px 0; border: none; background: #e2e8f0; color: #475569; font-size: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .mode-btn.active { background: #2563eb; color: #fff; }

    /* 主要內容字卡卡片 */
    .card { border: 1px solid #e2e8f0; border-radius: 20px; padding: 30px 20px; margin-bottom: 20px; background: #fff; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); min-height: 160px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
    .text-en { font-size: 24px; font-weight: 700; color: #1e293b; margin-bottom: 16px; line-height: 1.4; word-break: break-word; }
    .text-zh { font-size: 16px; font-weight: 500; color: #64748b; margin-bottom: 16px; word-break: break-word; }
    
    /* 可點擊點選的星星熟悉度 */
    .stars { color: #f59e0b; font-size: 24px; letter-spacing: 4px; cursor: pointer; user-select: none; }

    /* 控制按鈕組 */
    .control-row { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; }
    .btn { padding: 8px 16px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 4px; transition: 0.2s; }
    .btn-nav { background: #e2e8f0; color: #475569; }
    .btn-play { background: #2563eb; color: #fff; padding: 8px 20px; font-size: 15px; }
    .btn-pause { background: #f59e0b; color: #fff; }
    .btn-stop { background: #ef4444; color: #fff; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* 設定區塊標題 */
    .section-title { font-size: 13px; font-weight: bold; color: #64748b; margin: 12px 0 6px 0; }

    /* 參數選擇按鈕格 */
    .opt-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-bottom: 5px; }
    .opt-btn { padding: 6px 12px; border: 1px solid #e2e8f0; background: #e2e8f0; color: #475569; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.1s; min-width: 45px; }
    .opt-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }

    /* 播放模式按鈕 (連續/隨機) 藍色高亮樣式 */
    .play-mode-row { display: flex; justify-content: center; gap: 10px; margin: 10px 0; }
    .btn-mode { padding: 6px 14px; border: 1px solid #cbd5e1; background: #e2e8f0; color: #475569; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .btn-mode.active { background: #2563eb; color: #fff; border-color: #2563eb; box-shadow: 0 0 8px rgba(37,99,235,0.3); }

    /* 閱讀模式列表樣式 */
    .read-list { display: flex; flex-direction: column; gap: 10px; text-align: left; max-height: 55vh; overflow-y: auto; margin-top: 5px; padding-right: 4px; }
    .read-item { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
    .read-item:hover { background: #f1f5f9; }
    .read-content { flex: 1; padding-right: 10px; }
    .read-item .en { font-size: 16px; font-weight: bold; color: #1e293b; margin-bottom: 4px; line-height: 1.3; }
    .read-item .zh { font-size: 14px; color: #64748b; font-weight: 500; }
    .read-item .meta { font-size: 11px; color: #94a3b8; margin-top: 6px; display: flex; gap: 12px; }
    .btn-inline-play { background: #2563eb; color: #fff; border: none; border-radius: 50%; width: 34px; height: 34px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; box-shadow: 0 2px 6px rgba(37,99,235,0.2); }

    /* 新增項目按鈕 */
    .btn-add { width: 100%; max-width: 280px; margin-top: 20px; padding: 10px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; display: inline-flex; justify-content: center; align-items: center; gap: 6px; }

    .status-msg { color: #ef4444; font-weight: bold; font-size: 14px; margin: 15px 0; padding: 10px; background: #fef2f2; border-radius: 8px; border: 1px solid #fee2e2; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <h1>📚 英文學習資料庫</h1>

  <!-- 模式分頁按鈕切換 -->
  <div class="tab-group">
    <button class="tab-btn active" id="btn-tab-listen" onclick="switchTab('listen')">🎧 聽力模式</button>
    <button class="tab-btn" id="btn-tab-read" onclick="switchTab('read')">📖 閱讀模式</button>
  </div>

  <!-- 篩選範圍與搜尋列 -->
  <div class="filter-box">
    <div class="filter-row">
      <span class="filter-label">🎯 播放範圍：</span>
      <select id="categorySelect" onchange="applyFilters()">
        <option value="全部顯示">全部顯示</option>
      </select>
    </div>
    <!-- 搜尋框只在有需要時或閱讀模式時輔助，此處全域保留方便隨時使用 -->
    <div class="filter-row id-search-row">
      <span class="filter-label">🔍 搜尋關鍵字：</span>
      <input type="text" id="searchInput" class="search-input" placeholder="輸入中/英文/情境..." oninput="applyFilters()">
    </div>
  </div>

  <!-- 狀態提示（錯誤時顯示） -->
  <div id="statusMessage" class="status-msg hidden">❌ 資料載入失敗，請確認 試算表部署網址 是否正確。</div>

  <!-- ================= 聽力模式區塊 ================= -->
  <div id="listenSection">
    <div class="tool-bar">
      <div class="info-text" id="infoText">第 -- / -- 筆 [讀取中...]</div>
    </div>

    <!-- 顯示模式切換 -->
    <div class="mode-group">
      <button class="mode-btn active" id="m-en" onclick="changeDisplayMode('en')">英文</button>
      <button class="mode-btn" id="m-zh" onclick="changeDisplayMode('zh')">中文</button>
      <button class="mode-btn" id="m-all" onclick="changeDisplayMode('all')">英+中</button>
      <button class="mode-btn" id="m-blind" onclick="changeDisplayMode('blind')">盲聽</button>
    </div>

    <!-- 主字卡卡片 -->
    <div class="card">
      <div class="text-en" id="textEn">讀取中...</div>
      <div class="text-zh" id="textZh">--</div>
      <div class="stars" id="textStar" onclick="handleStarClick(event)">☆☆☆☆•</div>
    </div>

    <!-- 上下句與主播放控制 -->
    <div class="control-row">
      <button class="btn btn-nav" onclick="prevSentence()">⬅ 上一句</button>
      <button class="btn btn-play" id="playBtn" onclick="togglePlay()">🔊 播放</button>
      <button class="btn btn-nav" onclick="nextSentence()">下一句 ➡</button>
    </div>
    <div class="control-row">
      <button class="btn btn-pause" onclick="pauseAudio()">⏸ 暫停</button>
      <button class="btn btn-stop" onclick="stopAudio()">■ 停止</button>
    </div>

    <!-- 單句重複次數 -->
    <div class="section-title">單句重複次數</div>
    <div class="opt-grid" id="repeatGroup">
      <button class="opt-btn active" onclick="setRepeat(1, this)">1次</button>
      <button class="opt-btn" onclick="setRepeat(2, this)">2次</button>
      <button class="opt-btn" onclick="setRepeat(3, this)">3次</button>
      <button class="opt-btn" onclick="setRepeat(4, this)">4次</button>
      <button class="opt-btn" onclick="setRepeat(5, this)">5次</button>
      <button class="opt-btn" onclick="setRepeat(999, this)">無限</button>
    </div>

    <!-- 播放速度 -->
    <div class="section-title">播放速度</div>
    <div class="opt-grid" id="speedGroup">
      <button class="opt-btn" onclick="setSpeed(0.3, this)">0.3x</button>
      <button class="opt-btn" onclick="setSpeed(0.4, this)">0.4x</button>
      <button class="opt-btn" onclick="setSpeed(0.5, this)">0.5x</button>
      <button class="opt-btn" onclick="setSpeed(0.6, this)">0.6x</button>
      <button class="opt-btn active" onclick="setSpeed(0.7, this)">0.7x</button>
      <button class="opt-btn" onclick="setSpeed(0.8, this)">0.8x</button>
      <button class="opt-btn" onclick="setSpeed(0.9, this)">0.9x</button>
      <button class="opt-btn" onclick="setSpeed(1.0, this)">1.0x</button>
      <button class="opt-btn" onclick="setSpeed(1.2, this)">1.2x</button>
    </div>

    <!-- 連續/隨機播放模式 -->
    <div class="play-mode-row">
      <button class="btn-mode id-loop" id="modeLoop" onclick="setPlayMode('loop')">▶ 連續播放</button>
      <button class="btn-mode id-random" id="modeRandom" onclick="setPlayMode('random')">🔀 隨機播放</button>
    </div>

    <!-- 播放間隔 -->
    <div class="section-title">播放間隔 (句/字之間)</div>
    <div class="opt-grid" id="intervalGroup">
      <button class="opt-btn" onclick="setIntervalTime(1000, this)">1秒</button>
      <button class="opt-btn active" onclick="setIntervalTime(2000, this)">2秒</button>
      <button class="opt-btn" onclick="setIntervalTime(3000, this)">3秒</button>
      <button class="opt-btn" onclick="setIntervalTime(5000, this)">5秒</button>
    </div>
  </div>

  <!-- ================= 閱讀模式區塊 ================= -->
  <div id="readSection" class="hidden">
    <div class="tool-bar">
      <div class="tool-row-top">
        <div id="readCount" style="font-weight: bold; color: #475569; font-size: 14px;">共 0 筆資料</div>
      </div>
      <!-- 高級排序控制列 -->
      <div class="sort-grid" id="sortGroup">
        <button class="sort-btn active" id="sort-default" onclick="changeSortMode('default')">📋 預設</button>
        <button class="sort-btn" id="sort-az" onclick="changeSortMode('az')">🔤 A ➔ Z</button>
        <button class="sort-btn" id="sort-za" onclick="changeSortMode('za')">🔤 Z ➔ A</button>
        <button class="sort-btn" id="sort-random" onclick="changeSortMode('random')">🔀 隨機</button>
        <button class="sort-btn" id="sort-star" onclick="changeSortMode('star')">⭐ 熟悉度</button>
      </div>
    </div>
    <div class="read-list" id="readList"></div>
  </div>

  <!-- 新增項目按鈕 -->
  <button class="btn-add">➕ 新增項目 (單字/片語/句子)</button>
</div>

<script>
  // 拆解部署網址 ID
  const p1 = 'AKfycbyL3VisnFbNnt5Sj-2_78kJxAs';
  const p2 = 'CD49LplNAQ3CyGvQipAwG1E3-M0Ea35HzTIensStz';
  const API_URL = `https://script.google.com/macros/s/${p1}${p2}/exec`;

  let rawData = [];
  let filteredData = [];
  let currentIndex = 0;
  
  // 播放與顯示設定參數
  let displayMode = 'en'; 
  let repeatTimes = 1;
  let currentRepeatCount = 0;
  let playSpeed = 0.7;
  let autoPlayMode = ''; 
  let intervalTime = 2000;
  let isPlaying = false;
  let timeoutId = null;
  let currentSortMode = 'default'; // 'default', 'az', 'za', 'random', 'star'

  const synth = window.speechSynthesis;
  let utterance = null;
  let targetVoice = null;

  function loadVoices() {
    const voices = synth.getVoices();
    targetVoice = voices.find(v => v.name.includes('Google US English')) ||
                  voices.find(v => v.lang === 'en-US') ||
                  voices.find(v => v.lang.startsWith('en'));
  }
  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = loadVoices;
  }
  loadVoices();

  // 載入試算表資料
  async function loadSheetData() {
    try {
      const res = await fetch(API_URL);
      rawData = await res.json();
      
      // 【規格修正】預設熟悉度至少為 1 星
      rawData.forEach((item, idx) => {
        let starVal = parseInt(item.star || item.星級 || item.評價 || 0);
        if (starVal < 1) {
          starVal = 1;
        }
        item.star = starVal;
        item.originalIndex = idx;
      });
      
      document.getElementById('statusMessage').classList.add('hidden');
      initCategories();
      applyFilters();
    } catch (err) {
      document.getElementById('statusMessage').classList.remove('hidden');
      document.getElementById('textEn').innerText = '錯誤';
      console.error(err);
    }
  }

  // 初始化範圍下拉選單 (支援情境分類與星級篩選)
  function initCategories() {
    const categories = new Set();
    rawData.forEach(item => {
      // 相容多元欄位命名：分類、category、情境
      const cat = item.category || item.分類 || item.情境;
      if (cat) categories.add(cat.trim());
    });

    const select = document.getElementById('categorySelect');
    select.innerHTML = '<option value="全部顯示">全部顯示</option>';
    
    // 加入情境分類標籤
    categories.forEach(cat => {
      const opt = document.createElement('option');
      opt.value = cat;
      opt.innerText = `🏷️ 分類: ${cat}`;
      select.appendChild(opt);
    });

    // 加入星級篩選選項，達成「播放範圍自訂選擇」
    for(let s=1; s<=5; s++) {
      const opt = document.createElement('option');
      opt.value = `STAR_${s}`;
      opt.innerText = `⭐ 熟悉度: ${s} 星`;
      select.appendChild(opt);
    }
  }

  // 篩選過濾與高級排序資料
  function applyFilters() {
    const selectedCat = document.getElementById('categorySelect').value;
    const searchKeyword = document.getElementById('searchInput').value.trim().toLowerCase();

    let temp = rawData.filter(item => {
      // 1. 分類/範圍篩選
      const cat = (item.category || item.分類 || item.情境 || '').trim();
      const star = item.star;
      
      if (selectedCat !== '全部顯示') {
        if (selectedCat.startsWith('STAR_')) {
          const targetStar = parseInt(selectedCat.split('_')[1]);
          if (star !== targetStar) return false;
        } else {
          if (cat !== selectedCat) return false;
        }
      }

      // 2. 關鍵字搜尋篩選 (支援情境、英文、中文)
      if (searchKeyword) {
        const en = (item.english || item.英文 || '').toLowerCase();
        const zh = (item.chinese || item.中文 || '').toLowerCase();
        if (!en.includes(searchKeyword) && !zh.includes(searchKeyword) && !cat.toLowerCase().includes(searchKeyword)) {
          return false;
        }
      }
      return true;
    });

    // 3. 處理進階排序多功能
    if (currentSortMode === 'az') {
      temp.sort((a, b) => {
        const enA = (a.english || a.英文 || '').trim().toLowerCase();
        const enB = (b.english || b.英文 || '').trim().toLowerCase();
        return enA.localeCompare(enB);
      });
    } else if (currentSortMode === 'za') {
      temp.sort((a, b) => {
        const enA = (a.english || a.英文 || '').trim().toLowerCase();
        const enB = (b.english || b.英文 || '').trim().toLowerCase();
        return enB.localeCompare(enA);
      });
    } else if (currentSortMode === 'random') {
      temp.sort(() => Math.random() - 0.5);
    } else if (currentSortMode === 'star') {
      // 熟悉度排序：星級由高到低
      temp.sort((a, b) => b.star - a.star);
    } else {
      // default: 還原回原始試算表排序
      temp.sort((a, b) => a.originalIndex - b.originalIndex);
    }

    filteredData = temp;
    currentIndex = 0;
    renderCard();
    renderReadList();
  }

  // 切換排序模式
  function changeSortMode(mode) {
    currentSortMode = mode;
    document.querySelectorAll('#sortGroup .sort-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`sort-${mode}`).classList.add('active');
    applyFilters();
  }

  // 渲染主卡片內容 (聽力模式)
  function renderCard() {
    if (filteredData.length === 0) {
      document.getElementById('textEn').innerText = '無符合資料';
      document.getElementById('textZh').innerText = '--';
      document.getElementById('textStar').innerText = '';
      document.getElementById('infoText').innerText = '第 0 / 0 筆';
      return;
    }

    const item = filteredData[currentIndex];
    const en = item.english || item.英文 || '';
    const zh = item.chinese || item.中文 || '';
    const star = item.star;
    const type = item.type || item.型態 || item.類型 || '句子';

    document.getElementById('infoText').innerText = `第 ${currentIndex + 1} / ${filteredData.length} 筆 [${type}]`;

    const enEl = document.getElementById('textEn');
    const zhEl = document.getElementById('textZh');

    enEl.innerText = (displayMode === 'zh' || displayMode === 'blind') ? '•••' : en;
    zhEl.innerText = (displayMode === 'en' || displayMode === 'blind') ? '•••' : zh;
    
    // 渲染星星熟悉度
    document.getElementById('textStar').innerText = '★'.repeat(star) + '☆'.repeat(5 - star);
  }

  // 處理點擊星星變更熟悉度
  function handleStarClick(e) {
    if (filteredData.length === 0) return;
    const starEl = e.currentTarget;
    const rect = starEl.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const width = rect.width;
    
    let newStar = Math.ceil((clickX / width) * 5);
    if (newStar < 1) newStar = 1; // 確保最低預設是 1 星
    if (newStar > 5) newStar = 5;

    const currentItem = filteredData[currentIndex];
    currentItem.star = newStar;
    
    const rawItem = rawData.find(r => r.originalIndex === currentItem.originalIndex);
    if (rawItem) {
      rawItem.star = newStar;
    }

    renderCard();
    renderReadList();
  }

  // 渲染閱讀模式清單
  function renderReadList() {
    const listContainer = document.getElementById('readList');
    document.getElementById('readCount').innerText = `共 ${filteredData.length} 筆資料`;
    listContainer.innerHTML = '';

    if (filteredData.length === 0) {
      listContainer.innerHTML = '<div style="text-align:center; color:#94a3b8; padding: 20px;">沒有符合條件的內容</div>';
      return;
    }

    filteredData.forEach((item, index) => {
      const en = item.english || item.英文 || '';
      const zh = item.chinese || item.中文 || '';
      const star = item.star;
      const cat = item.category || item.分類 || item.情境 || '未分類';
      const type = item.type || item.型態 || item.類型 || '句子';
      
      const div = document.createElement('div');
      div.className = 'read-item';
      
      const contentDiv = document.createElement('div');
      contentDiv.className = 'read-content';
      contentDiv.innerHTML = `
        <div class="en">${index + 1}. ${en}</div>
        <div class="zh">${zh}</div>
        <div class="meta">
          <span>🏷️ ${cat} (${type})</span>
          <span style="color: #f59e0b;">${'★'.repeat(star)}</span>
        </div>
      `;
      
      const playBtn = document.createElement('button');
      playBtn.className = 'btn-inline-play';
      playBtn.innerHTML = '🔊';
      playBtn.onclick = (e) => {
        e.stopPropagation();
        speakDirect(en);
      };
      
      div.appendChild(contentDiv);
      div.appendChild(playBtn);
      listContainer.appendChild(div);
    });
  }

  function speakDirect(text) {
    synth.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    if (targetVoice) utt.voice = targetVoice;
    utt.lang = 'en-US';
    utt.rate = playSpeed;
    synth.speak(utt);
  }

  function switchTab(tab) {
    document.getElementById('btn-tab-listen').classList.toggle('active', tab === 'listen');
    document.getElementById('btn-tab-read').classList.toggle('active', tab === 'read');
    
    document.getElementById('listenSection').classList.toggle('hidden', tab !== 'listen');
    document.getElementById('readSection').classList.toggle('hidden', tab !== 'read');

    if (tab === 'read') stopAudio();
  }

  function changeDisplayMode(mode) {
    displayMode = mode;
    ['en', 'zh', 'all', 'blind'].forEach(m => {
      document.getElementById(`m-${m}`).classList.toggle('active', m === mode);
    });
    renderCard();
  }

  function setRepeat(times, btn) {
    repeatTimes = times;
    clearActive('repeatGroup');
    btn.classList.add('active');
  }

  // 【功能修正】當在播放中改變語速時，重新生成語音而不中斷自動下一句的排程
  function setSpeed(speed, btn) {
    playSpeed = speed;
    clearActive('speedGroup');
    btn.classList.add('active');
    
    if (isPlaying) {
      // 如果正在播放，直接重新呼叫 speakCurrent() 套用新速度，它會繼續接下去播
      speakCurrent();
    }
  }

  function setIntervalTime(ms, btn) {
    intervalTime = ms;
    clearActive('intervalGroup');
    btn.classList.add('active');
  }

  function setPlayMode(mode) {
    if (autoPlayMode === mode) {
      autoPlayMode = ''; 
      document.getElementById('modeLoop').classList.remove('active');
      document.getElementById('modeRandom').classList.remove('active');
    } else {
      autoPlayMode = mode;
      document.getElementById('modeLoop').classList.toggle('active', mode === 'loop');
      document.getElementById('modeRandom').classList.toggle('active', mode === 'random');
    }
  }

  function clearActive(parentId) {
    document.getElementById(parentId).querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
  }

  // 核心語音播放邏輯
  function speakCurrent() {
    if (filteredData.length === 0) return;
    if (timeoutId) clearTimeout(timeoutId);

    const item = filteredData[currentIndex];
    const en = item.english || item.英文 || '';

    synth.cancel();
    utterance = new SpeechSynthesisUtterance(en);
    if (targetVoice) utterance.voice = targetVoice;
    utterance.lang = 'en-US';
    utterance.rate = playSpeed;

    if (playSpeed < 1.0) {
      utterance.pitch = 1.05; 
    }

    utterance.onend = () => {
      currentRepeatCount++;
      if (currentRepeatCount < repeatTimes && isPlaying) {
        timeoutId = setTimeout(speakCurrent, 500);
      } else if (isPlaying) {
        if (autoPlayMode === 'loop') {
          timeoutId = setTimeout(() => { nextSentence(true); }, intervalTime);
        } else if (autoPlayMode === 'random') {
          timeoutId = setTimeout(() => { triggerRandomNext(); }, intervalTime);
        } else {
          stopAudio();
        }
      }
    };

    utterance.onerror = () => {
      // 防止因為切換速度觸發 cancel 導致的錯誤中斷，只要還是播放狀態就不停
      if (isPlaying && synth.speaking === false) {
        stopAudio();
      }
    };

    synth.speak(utterance);
  }

  function triggerRandomNext() {
    if (filteredData.length <= 1) return;
    let nextIdx = currentIndex;
    while (nextIdx === currentIndex) {
      nextIdx = Math.floor(Math.random() * filteredData.length);
    }
    currentIndex = nextIdx;
    currentRepeatCount = 0;
    renderCard();
    speakCurrent();
  }

  function togglePlay() {
    if (isPlaying) {
      pauseAudio();
    } else {
      isPlaying = true;
      currentRepeatCount = 0;
      document.getElementById('playBtn').innerText = '⏸ 播放中';
      speakCurrent();
    }
  }

  function pauseAudio() {
    isPlaying = false;
    synth.pause();
    if (timeoutId) clearTimeout(timeoutId);
    document.getElementById('playBtn').innerText = '🔊 播放';
  }

  function stopAudio() {
    isPlaying = false;
    synth.cancel();
    if (timeoutId) clearTimeout(timeoutId);
    currentRepeatCount = 0;
    document.getElementById('playBtn').innerText = '🔊 播放';
  }

  function nextSentence(auto = false) {
    if (filteredData.length === 0) return;
    if (currentIndex < filteredData.length - 1) {
      currentIndex++;
    } else {
      currentIndex = 0; 
    }
    currentRepeatCount = 0;
    renderCard();
    if ((auto || isPlaying) && autoPlayMode !== 'random') speakCurrent();
  }

  function prevSentence() {
    if (filteredData.length === 0) return;
    if (currentIndex > 0) {
      currentIndex--;
    } else {
      currentIndex = filteredData.length - 1;
    }
    currentRepeatCount = 0;
    renderCard();
    if (isPlaying) speakCurrent();
  }

  loadSheetData();
</script>

</body>
</html>
