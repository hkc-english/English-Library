<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英文學習資料庫</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f1f5f9; margin: 0; padding: 12px; color: #1e293b; }
    .container { max-width: 720px; margin: 0 auto; background: #ffffff; padding: 16px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    
    header { text-align: center; margin-bottom: 12px; }
    h1 { font-size: 1.4rem; margin: 0 0 8px 0; color: #0f172a; }
    
    /* 模式切換按鈕 */
    .mode-switcher { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; }
    .mode-btn { flex: 1; padding: 8px 12px; border: 2px solid #2563eb; background: #fff; color: #2563eb; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
    .mode-btn.active { background: #2563eb; color: #fff; }

    /* 控制控制面板 */
    .filter-panel { background: #f8fafc; border: 1px solid #e2e8f0; padding: 10px; border-radius: 10px; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .filter-group { display: flex; align-items: center; gap: 4px; font-size: 0.85rem; font-weight: bold; color: #475569; }
    select, input[type="text"] { padding: 6px 10px; border-radius: 6px; border: 1px solid #cbd5e1; outline: none; font-size: 0.85rem; }
    input[type="text"] { flex: 1; min-width: 140px; }

    /* 卡片（聽力模式） */
    .card { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px; padding: 20px 16px; text-align: center; min-height: 180px; display: flex; flex-direction: column; justify-content: center; align-items: center; margin-bottom: 12px; }
    .card-en { font-size: 1.25rem; font-weight: bold; color: #1e293b; margin-bottom: 8px; }
    .card-zh { font-size: 1.05rem; color: #475569; margin-top: 4px; }
    .count-info { font-size: 0.8rem; color: #64748b; margin-bottom: 8px; text-align: center; }

    /* 星星按鈕 */
    .star-container { margin-top: 10px; display: flex; gap: 4px; justify-content: center; }
    .star { font-size: 1.5rem; color: #cbd5e1; cursor: pointer; user-select: none; transition: color 0.15s; }
    .star.filled { color: #f59e0b; }

    /* 工具按鈕與播放面板 */
    .btn-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
    button { border: none; padding: 8px 10px; border-radius: 8px; background: #e2e8f0; color: #334155; font-size: 0.85rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:active { opacity: 0.8; }
    button.active { background: #2563eb; color: #fff; }
    
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-success { background: #10b981; color: #fff; }
    .btn-warning { background: #f59e0b; color: #fff; }

    /* 閱讀模式（清單視圖） */
    #readModeContainer { display: none; }
    .read-list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .read-item { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; margin-bottom: 8px; transition: background 0.2s; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .read-item.speaking { background: #fef3c7; border-color: #f59e0b; }
    .read-content { flex: 1; }
    .read-en { font-weight: bold; font-size: 1rem; color: #0f172a; margin-bottom: 4px; cursor: pointer; }
    .read-zh { font-size: 0.9rem; color: #475569; }
    .read-zh.hidden-text { display: none; }
    .read-tags { margin-top: 4px; }
    .tag-badge { background-color: #e0f2fe; color: #0369a1; padding: 2px 6px; border-radius: 10px; font-size: 0.75rem; margin-right: 4px; display: inline-block; }
    .read-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .speak-icon-btn { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 4px 8px; border-radius: 6px; font-size: 1rem; cursor: pointer; }

    /* 語音與間隔高亮標籤 */
    .speed-button.active-speed, .interval-button.active-interval, .repeat-button.active-repeat { background: #2563eb !important; color: #ffffff !important; }

    /* 新增面板 Modal */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
    .modal-content { background: #fff; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; }
    .modal-content input, .modal-content select { width: 100%; margin-bottom: 10px; }

    .status-bar { text-align: center; font-size: 0.8rem; color: #64748b; min-height: 1.2em; margin-top: 4px; }
    .error-msg { color: #ef4444; text-align: center; font-size: 0.85rem; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>📚 英文學習資料庫</h1>
  </header>

  <!-- 模式切換 -->
  <div class="mode-switcher">
    <button class="mode-btn active" id="btnModeAudio" onclick="switchViewMode('audio')">🎧 聽力模式</button>
    <button class="mode-btn" id="btnModeRead" onclick="switchViewMode('read')">📖 閱讀模式</button>
  </div>

  <!-- 綜合篩選與搜尋列 -->
  <div class="filter-panel">
    <div class="filter-group">
      🔍 <input type="text" id="searchInput" placeholder="搜尋中英文..." oninput="onFilterChange()">
    </div>
    <div class="filter-group">
      🎯 類型:
      <select id="typeFilter" onchange="onFilterChange()">
        <option value="all">全部</option>
        <option value="單字">單字</option>
        <option value="片語">片語</option>
        <option value="句子">句子</option>
      </select>
    </div>
    <div class="filter-group">
      🏷️ 情境:
      <select id="tagFilter" onchange="onFilterChange()">
        <option value="all">全部分類</option>
      </select>
    </div>
    <div class="filter-group">
      ⭐ 熟悉度:
      <select id="statusFilter" onchange="onFilterChange()">
        <option value="all">全部</option>
        <option value="lte3">1 ~ 3 星</option>
        <option value="1">1 星</option>
        <option value="2">2 星</option>
        <option value="3">3 星</option>
        <option value="4">4 星</option>
        <option value="5">5 星</option>
      </select>
    </div>
    <!-- 閱讀模式專用排序選單 -->
    <div class="filter-group" id="sortGroup" style="display:none;">
      🔀 排序:
      <select id="sortOrder" onchange="onFilterChange()">
        <option value="default">預設順序</option>
        <option value="az">A ➔ Z</option>
        <option value="za">Z ➔ A</option>
        <option value="statusAsc">熟悉度 (低 ➔ 高)</option>
        <option value="statusDesc">熟悉度 (高 ➔ 低)</option>
        <option value="random">隨機洗牌</option>
      </select>
    </div>
  </div>

  <!-- ==================== 聽力模式區塊 ==================== -->
  <div id="audioModeContainer">
    <div class="count-info" id="count">資料載入中...</div>

    <div class="toolbar btn-grid" style="grid-template-columns: repeat(4, 1fr);">
      <button onclick="changeShow('en')" class="active">英文</button>
      <button onclick="changeShow('zh')">中文</button>
      <button onclick="changeShow('both')">英＋中</button>
      <button onclick="blindMode()">盲聽</button>
    </div>

    <div class="card">
      <div id="english" class="card-en"></div>
      <div id="chinese" class="card-zh"></div>
      <div class="star-container" id="starContainer">
        <span class="star" onclick="updateCurrentRating(1)">★</span>
        <span class="star" onclick="updateCurrentRating(2)">★</span>
        <span class="star" onclick="updateCurrentRating(3)">★</span>
        <span class="star" onclick="updateCurrentRating(4)">★</span>
        <span class="star" onclick="updateCurrentRating(5)">★</span>
      </div>
    </div>

    <div class="btn-grid">
      <button onclick="previousSentence()">⬅ 上一句</button>
      <button onclick="startSinglePlay()" class="btn-primary">🔊 單句發音</button>
      <button id="pauseButton" onclick="togglePause()">⏸ 暫停</button>
      <button onclick="nextSentence()">下一句 ➔</button>
    </div>

    <div class="btn-grid" style="grid-template-columns: repeat(3, 1fr);">
      <button id="btnContinuous" onclick="startContinuousPlay()" class="btn-success">▶️ 順序播放</button>
      <button id="btnRandom" onclick="startRandomPlay()" class="btn-success">🔀 隨機播放</button>
      <button onclick="stopAllPlayback()" class="btn-warning">⏹ 停止</button>
    </div>

    <!-- 語速、重複與間隔設定 -->
    <div style="font-size: 0.8rem; font-weight: bold; margin-top: 8px; color: #475569;">語速設定：</div>
    <div class="btn-grid" style="grid-template-columns: repeat(4, 1fr); margin-bottom: 8px;">
      <button class="speed-button" data-rate="0.5" onclick="setSpeechRate(0.5)">0.5x</button>
      <button class="speed-button" data-rate="0.7" onclick="setSpeechRate(0.7)">0.7x</button>
      <button class="speed-button" data-rate="0.9" onclick="setSpeechRate(0.9)">0.9x</button>
      <button class="speed-button" data-rate="1.0" onclick="setSpeechRate(1.0)">1.0x</button>
    </div>

    <div style="font-size: 0.8rem; font-weight: bold; color: #475569;">單句重複：</div>
    <div class="btn-grid" style="grid-template-columns: repeat(4, 1fr); margin-bottom: 8px;">
      <button class="repeat-button" data-repeat="1" onclick="setRepeatTimes(1)">1 次</button>
      <button class="repeat-button" data-repeat="2" onclick="setRepeatTimes(2)">2 次</button>
      <button class="repeat-button" data-repeat="3" onclick="setRepeatTimes(3)">3 次</button>
      <button class="repeat-button" data-repeat="999" onclick="setRepeatTimes(999)">無限</button>
    </div>

    <div style="font-size: 0.8rem; font-weight: bold; color: #475569;">播放間隔：</div>
    <div class="btn-grid" style="grid-template-columns: repeat(4, 1fr);">
      <button class="interval-button" data-interval="1000" onclick="setPlaybackInterval(1000)">1 秒</button>
      <button class="interval-button" data-interval="2000" onclick="setPlaybackInterval(2000)">2 秒</button>
      <button class="interval-button" data-interval="3000" onclick="setPlaybackInterval(3000)">3 秒</button>
      <button class="interval-button" data-interval="5000" onclick="setPlaybackInterval(5000)">5 秒</button>
    </div>
  </div>

  <!-- ==================== 閱讀模式區塊 ==================== -->
  <div id="readModeContainer">
    <div class="read-list-header">
      <div id="readCountInfo" style="font-size: 0.85rem; font-weight: bold; color: #475569;">共 0 筆資料</div>
      <button onclick="toggleAllChineseReadView()" id="btnToggleChinese" class="btn-primary" style="padding: 4px 10px;">👁️ 隱藏中文</button>
    </div>
    
    <!-- 閱讀模式清單產生處 -->
    <div id="readList"></div>
  </div>

  <!-- 狀態提示與新增按鈕 -->
  <div class="status-bar" id="playbackStatus"></div>
  <div class="error-msg" id="errorMessage"></div>

  <div style="margin-top: 16px; text-align: center;">
    <button onclick="showAddForm()" class="btn-primary" style="width: 100%; padding: 10px; font-size: 0.95rem;">➕ 新增單字 / 句子</button>
  </div>
</div>

<!-- 新增視窗 -->
<div class="modal" id="addForm">
  <div class="modal-content">
    <h3 style="margin-top:0;">新增英文項目</h3>
    <input type="text" id="newEnglish" placeholder="請輸入英文..." oninput="autoDetectTypeAndCheckDuplicate()">
    <div id="duplicateWarning" style="color:#d97706; font-size:0.8rem; display:none; margin-bottom:8px;"></div>
    
    <input type="text" id="newChinese" placeholder="中文翻譯">
    <div id="aiTagsContainer" style="margin-bottom: 8px;"></div>

    <label style="font-size:0.8rem;">類型：</label>
    <select id="newType">
      <option value="單字">單字</option>
      <option value="片語">片語</option>
      <option value="句子" selected>句子</option>
    </select>

    <label style="font-size:0.8rem;">初始熟悉度：</label>
    <select id="newStatus">
      <option value="1">1 星</option>
      <option value="2">2 星</option>
      <option value="3">3 星</option>
      <option value="4">4 星</option>
      <option value="5">5 星</option>
    </select>

    <div id="addMessage" style="font-size:0.8rem; text-align:center; margin-bottom:8px;"></div>

    <div style="display:flex; gap:8px;">
      <button onclick="addSentence()" class="btn-primary" style="flex:1;">儲存</button>
      <button onclick="hideAddForm()" style="flex:1;">取消</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
