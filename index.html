<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英文學習資料庫</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 12px; color: #333; display: flex; justify-content: center; }
    .container { max-width: 480px; width: 100%; background: #fff; padding: 20px; border-radius: 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.05); text-align: center; }
    
    .check-box { background: #fff7ed; border: 2px solid #fdba74; border-radius: 16px; padding: 15px; margin-bottom: 20px; text-align: left; }
    .check-title { font-size: 14px; font-weight: bold; color: #c2410c; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .check-target { font-size: 15px; font-weight: bold; color: #1e293b; margin-bottom: 10px; line-height: 1.4; word-break: break-word; }
    
    h1 { font-size: 22px; color: #1e293b; margin-top: 5px; margin-bottom: 15px; display: flex; justify-content: center; align-items: center; gap: 8px; }
    
    .tab-group { display: flex; gap: 12px; margin-bottom: 15px; }
    .tab-btn { flex: 1; padding: 12px; font-size: 15px; font-weight: bold; border: 2px solid #2563eb; background: #fff; color: #2563eb; border-radius: 10px; cursor: pointer; transition: all 0.2s; text-align: center; }
    .tab-btn.active { background: #2563eb; color: #fff; }

    .filter-box { background: #edf2f7; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px; align-items: center; justify-content: center; }
    .search-row { display: flex; align-items: center; width: 100%; gap: 8px; }
    .filter-label { font-size: 14px; font-weight: bold; color: #1e3a8a; white-space: nowrap; }
    .search-input { padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; background: #fff; width: 100%; font-weight: bold; }
    
    .type-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; margin-top: 4px; }
    .type-btn { padding: 8px 4px; font-size: 13px; font-weight: bold; border: 1px solid #cbd5e1; background: #fff; border-radius: 6px; cursor: pointer; color: #475569; text-align: center; }
    .type-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }

    .filter-checkbox-row { width: 100%; display: flex; align-items: center; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px 12px; cursor: pointer; margin-top: 4px; text-align: left; }
    .filter-checkbox-row input { margin-right: 8px; width: 16px; height: 16px; cursor: pointer; }
    .filter-checkbox-row label { font-size: 13px; font-weight: bold; color: #475569; cursor: pointer; user-select: none; display: flex; align-items: center; gap: 4px; width: 100%; }

    .sort-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; margin-bottom: 15px; }
    .sort-btn { padding: 8px 4px; font-size: 12px; font-weight: bold; border: 1px solid #cbd5e1; background: #fff; border-radius: 6px; cursor: pointer; color: #475569; text-align: center; }
    .sort-btn.active { background: #0f766e; color: #fff; border-color: #0f766e; }

    .display-mode-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; margin-bottom: 10px; }
    .display-mode-btn { padding: 8px 2px; font-size: 12px; font-weight: bold; border: 1px solid #cbd5e1; background: #fff; border-radius: 8px; cursor: pointer; color: #475569; text-align: center; }
    .display-mode-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }

    .card { border: 1px solid #e2e8f0; border-radius: 20px; padding: 24px 16px; margin-bottom: 15px; background: #fff; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); min-height: 140px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
    .text-en { font-size: 22px; font-weight: 700; color: #1e293b; margin-bottom: 12px; line-height: 1.4; word-break: break-word; width: 100%; }
    .text-zh { font-size: 15px; font-weight: 500; color: #64748b; margin-bottom: 12px; word-break: break-word; width: 100%; }
    .stars { color: #f59e0b; font-size: 24px; letter-spacing: 6px; cursor: pointer; z-index: 10; user-select: none; padding: 4px; }
    .stars span { transition: transform 0.1s; display: inline-block; }
    .stars span:hover { transform: scale(1.2); }

    .control-panel { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; padding: 14px; margin-top: 15px; display: flex; flex-direction: column; gap: 10px; }
    .control-sub-row { display: flex; gap: 6px; align-items: center; justify-content: center; flex-wrap: wrap; }
    .ctrl-group-title { font-size: 14px; font-weight: 800; color: #1e293b; width: 100%; text-align: left; margin-top: 6px; margin-bottom: -2px; }
    .ctrl-btn { flex: 1; padding: 10px 4px; font-size: 13px; font-weight: bold; border: 1px solid #cbd5e1; background: #fff; color: #475569; border-radius: 8px; cursor: pointer; text-align: center; min-width: 55px; }
    .ctrl-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }

    .control-row { display: flex; justify-content: center; align-items: center; gap: 6px; margin-bottom: 5px; width: 100%; }
    .btn { padding: 10px 4px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 2px; transition: 0.2s; flex: 1; white-space: nowrap; }
    .btn-nav { background: #e2e8f0; color: #475569; }
    .btn-play { background: #2563eb; color: #fff; }
    .btn-stop { background: #ef4444; color: #fff; }

    .input-section { margin-top: 25px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 16px; padding: 15px; text-align: left; }
    .input-title { font-size: 14px; font-weight: bold; color: #1e293b; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 12px; font-weight: bold; color: #475569; margin-bottom: 4px; }
    .form-input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; background: #fff; }

    .read-list { display: flex; flex-direction: column; gap: 10px; text-align: left; max-height: 42vh; overflow-y: auto; margin-top: 5px; padding-right: 4px; }
    .read-item { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; display: flex; justify-content: space-between; align-items: center; }
    .read-content { flex: 1; padding-right: 10px; }
    .read-item .en { font-size: 16px; font-weight: bold; color: #1e293b; margin-bottom: 4px; line-height: 1.3; word-break: break-word; }
    .read-item .zh { font-size: 14px; color: #64748b; font-weight: 500; word-break: break-word; }
    .read-item .meta { font-size: 11px; color: #94a3b8; margin-top: 6px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    
    .read-actions-row { display: flex; gap: 6px; align-items: center; }
    .read-speak-btn { background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 6px 10px; font-size: 12px; font-weight: bold; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 4px; }
    .read-ai-btn { background: #7c3aed; color: #fff; border: none; border-radius: 6px; padding: 6px 10px; font-size: 12px; font-weight: bold; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 4px; }

    .read-toggle-row { display: flex; gap: 6px; margin-bottom: 10px; align-items: center; }
    .toggle-chip { padding: 6px 12px; font-size: 12px; font-weight: bold; border: 1px solid #cbd5e1; background: #fff; color: #475569; border-radius: 8px; cursor: pointer; user-select: none; }
    .toggle-chip.active { background: #0f766e; color: #fff; border-color: #0f766e; }

    /* AI 衍生面板樣式 */
    .ai-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
    .ai-modal { background: #fff; width: 100%; max-width: 440px; border-radius: 20px; padding: 20px; text-align: left; box-shadow: 0 10px 25px rgba(0,0,0,0.2); max-height: 85vh; overflow-y: auto; }
    .ai-modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; }
    .ai-modal-title { font-size: 16px; font-weight: bold; color: #7c3aed; display: flex; align-items: center; gap: 6px; }
    .ai-close-btn { background: none; border: none; font-size: 18px; cursor: pointer; color: #64748b; font-weight: bold; }
    .ai-loading { text-align: center; padding: 30px; color: #64748b; font-weight: bold; font-size: 14px; }
    .ai-section-title { font-size: 13px; font-weight: bold; color: #475569; margin: 12px 0 6px 0; display: flex; align-items: center; gap: 4px; }
    .ai-suggestion-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .ai-suggestion-info { flex: 1; }
    .ai-sug-en { font-size: 14px; font-weight: bold; color: #1e293b; margin-bottom: 2px; word-break: break-word; }
    .ai-sug-zh { font-size: 12px; color: #64748b; word-break: break-word; }
    .ai-add-btn { background: #ea580c; color: #fff; border: none; border-radius: 6px; padding: 6px 10px; font-size: 12px; font-weight: bold; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 2px; }
    .ai-add-btn:disabled { background: #cbd5e1; cursor: not-allowed; }

    .tag-select-container { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; max-height: 100px; overflow-y: auto; background: #fff; padding: 8px; border: 1px solid #cbd5e1; border-radius: 8px; }
    .tag-chip { padding: 6px 12px; font-size: 12px; font-weight: bold; border: 1px solid #cbd5e1; background: #f8fafc; color: #475569; border-radius: 15px; cursor: pointer; user-select: none; }
    .tag-chip.active { background: #2563eb; color: #fff; border-color: #2563eb; }

    .btn-submit-add { width: 100%; padding: 12px; background: #ea580c; color: #fff; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 8px; }
    .status-msg { color: #ef4444; font-weight: bold; font-size: 14px; margin: 15px 0; padding: 10px; background: #fef2f2; border-radius: 8px; border: 1px solid #fee2e2; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <h1>📚 英文學習資料庫</h1>

  <div id="checkSection" class="check-box hidden">
    <div class="check-title">
      <span>🎯 待分類資料檢核</span>
      <span id="checkCount" style="background: #fb923c; color: #fff; padding: 2px 8px; border-radius: 10px; font-size: 12px;">0 筆</span>
    </div>
    <div id="checkTarget" class="check-target">讀取中...</div>
    <div class="tag-select-container" id="checkTagContainer"></div>
    <button class="btn-submit-add" id="btnConfirm" onclick="confirmTag()">確認並更新標籤</button>
  </div>

  <div class="tab-group">
    <button class="tab-btn active" id="btn-tab-listen" onclick="switchTab('listen')">🎧 聽力模式</button>
    <button class="tab-btn" id="btn-tab-read" onclick="switchTab('read')">📖 閱讀模式</button>
  </div>

  <div class="filter-box">
    <div class="search-row">
      <span class="filter-label">🔍 搜尋：</span>
      <input type="text" id="searchInput" class="search-input" placeholder="搜尋英文、中文或分類..." oninput="applyFilters()">
    </div>
    
    <div class="type-grid" id="typeGroup">
      <button class="type-btn active" id="type-all" onclick="changeTypeFilter('all')">全部</button>
      <button class="type-btn" id="type-word" onclick="changeTypeFilter('單字')">單字</button>
      <button class="type-btn" id="type-phrase" onclick="changeTypeFilter('片語')">片語</button>
      <button class="type-btn" id="type-sentence" onclick="changeTypeFilter('句子')">句子</button>
    </div>

    <div class="filter-checkbox-row" id="weakOnlyRow">
      <label>
        <input type="checkbox" id="weakOnlyCheckbox" onchange="applyFilters()"> ⚡ 僅聽弱項 (排除 4~5 星)
      </label>
    </div>
  </div>

  <div id="statusMessage" class="status-msg hidden">❌ 資料載入失敗</div>

  <div id="listenSection">
    <div style="font-size: 14px; color: #475569; font-weight: bold; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;">
      <span id="infoText">第 -- / -- 筆</span>
    </div>

    <div class="display-mode-grid" id="displayModeGroup">
      <button class="display-mode-btn active" id="mode-en-zh" onclick="changeDisplayMode('en-zh')">英 + 中</button>
      <button class="display-mode-btn" id="mode-en-only" onclick="changeDisplayMode('en-only')">僅看英文</button>
      <button class="display-mode-btn" id="mode-zh-only" onclick="changeDisplayMode('zh-only')">僅看中文</button>
      <button class="display-mode-btn" id="mode-blind" onclick="changeDisplayMode('blind')">盲聽模式</button>
    </div>
    
    <div class="card">
      <div class="text-en" id="textEn">讀取中...</div>
      <div class="text-zh" id="textZh">--</div>
      <div class="stars" id="textStar"></div>
    </div>

    <div class="control-row">
      <button class="btn btn-nav" onclick="prevSentence()">⬅ 上一句</button>
      <button class="btn btn-play" id="playBtn" onclick="handlePlayToggle()">🔊 播放</button>
      <button class="btn btn-stop" onclick="stopAudioCompletely()">■ 停止</button>
      <button class="btn btn-nav" onclick="nextSentence()">下一句 ➡</button>
    </div>

    <div class="control-panel">
      <div class="ctrl-group-title">重複次數</div>
      <div class="control-sub-row">
        <button class="ctrl-btn" onclick="setRepeat(1)" id="rep-1">1次</button>
        <button class="ctrl-btn active" onclick="setRepeat(2)" id="rep-2">2次</button>
        <button class="ctrl-btn" onclick="setRepeat(3)" id="rep-3">3次</button>
        <button class="ctrl-btn" onclick="setRepeat(99)" id="rep-inf">無限</button>
      </div>

      <div class="ctrl-group-title">播放速度</div>
      <div class="control-sub-row">
        <button class="ctrl-btn" onclick="setSpeed(0.4)" id="spd-0.4">0.4x</button>
        <button class="ctrl-btn" onclick="setSpeed(0.6)" id="spd-0.6">0.6x</button>
        <button class="ctrl-btn active" onclick="setSpeed(0.8)" id="spd-0.8">0.8x</button>
        <button class="ctrl-btn" onclick="setSpeed(1.0)" id="spd-1.0">1.0x</button>
      </div>

      <div class="ctrl-group-title">播放模式與間隔</div>
      <div class="control-sub-row">
        <button class="ctrl-btn" id="btnContinuous" onclick="setPlayMode('continuous')">連續播放</button>
        <button class="ctrl-btn" id="btnRandomPlay" onclick="setPlayMode('random')">隨機播放</button>
        <button class="ctrl-btn active" onclick="setIntervalTime(1)" id="int-1">間隔1秒</button>
        <button class="ctrl-btn" onclick="setIntervalTime(3)" id="int-3">間隔3秒</button>
      </div>
    </div>
  </div>

  <div id="readSection" class="hidden">
    <div id="dataCountText" style="font-weight: bold; color: #475569; font-size: 14px; margin-bottom: 8px; text-align: left;">共 0 筆資料</div>
    
    <div class="read-toggle-row">
      <span style="font-size: 13px; font-weight: bold; color: #475569;">顯示設定：</span>
      <div class="toggle-chip active" id="toggleReadEn" onclick="toggleReadField('en')">👁️ 顯示英文</div>
      <div class="toggle-chip active" id="toggleReadZh" onclick="toggleReadField('zh')">👁️ 顯示中文</div>
    </div>

    <div class="sort-grid">
      <button class="sort-btn active" id="sort-default" onclick="changeSort('default')">預設</button>
      <button class="sort-btn" id="sort-asc" onclick="changeSort('asc')">熟悉度 (低 ➔ 高)</button>
      <button class="sort-btn" id="sort-desc" onclick="changeSort('desc')">熟悉度 (高 ➔ 降)</button>
      <button class="sort-btn" id="sort-az" onclick="changeSort('az')">A ➔ Z</button>
      <button class="sort-btn" id="sort-za" onclick="changeSort('za')">Z ➔ A</button>
      <button class="sort-btn" id="sort-random" onclick="changeSort('random')">隨機排列</button>
    </div>

    <div class="read-list" id="readList"></div>
  </div>

  <div class="input-section">
    <div class="input-title">✍️ 新增學習資料與情境分類</div>
    <div class="form-group">
      <label>英文 (English)</label>
      <input type="text" id="inputEnglish" class="form-input" placeholder="輸入英文單字、片語或句子">
    </div>
    <div class="form-group">
      <label>中文翻譯 (Chinese)</label>
      <input type="text" id="inputChinese" class="form-input" placeholder="輸入中文意思 (可留白自動翻譯)">
    </div>
    <div class="form-group">
      <label>選擇情境分類標籤</label>
      <div class="tag-select-container" id="inputTagContainer"></div>
    </div>
    <button class="btn-submit-add" onclick="submitNewData()">新增至資料庫</button>
  </div>
</div>

<!-- AI 智慧衍生對話框容器 -->
<div id="aiModalOverlay" class="ai-modal-overlay hidden">
  <div class="ai-modal">
    <div class="ai-modal-header">
      <div class="ai-modal-title">✨ AI 智慧衍生句與相反例句</div>
      <button class="ai-close-btn" onclick="closeAiModal()">✕</button>
    </div>
    <div id="aiModalContent">
      <div class="ai-loading">正在透過 AI 產生相關與相反例句，請稍候...</div>
    </div>
  </div>
</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbyL3VisnFbNnt5Sj-2_78kJxAsCD49LplNAQ3CyGvQipAwG1E3-M0Ea35HzTIensStz/exec';

  let rawData = [];
  let filteredData = [];
  let pendingData = [];
  let availableTags = []; 
  let currentIndex = 0;
  let currentTab = 'listen';
  let selectedTypeFilter = 'all';
  let currentSort = 'default';
  let displayMode = 'en-zh';

  let showReadEn = true;
  let showReadZh = true;

  let repeatCount = 2;
  let playbackSpeed = 0.8;
  let playMode = 'single'; 
  let intervalSeconds = 1;
  
  let playerState = 'stopped';
  let speechTimer = null;
  let currentUtterance = null;

  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = () => {
      window.speechSynthesis.getVoices();
    };
  }

  async function loadSheetData() {
    try {
      const res = await fetch(API_URL);
      const resJson = await res.json();
      
      rawData = resJson.data || [];
      availableTags = resJson.tags || [];
      
      rawData.forEach((item, idx) => {
        let rawStar = item.star ?? 1;
        item.star = isNaN(parseInt(rawStar)) ? 1 : parseInt(rawStar);
        item.originalIndex = idx;
        item.tagStr = (item.tagStr || '').toString().trim();
      });
      
      document.getElementById('statusMessage').classList.add('hidden');
      checkPendingData();
      renderInputTags();
      applyFilters();
    } catch (err) {
      document.getElementById('statusMessage').classList.remove('hidden');
      console.error(err);
    }
  }

  function renderInputTags() {
    const container = document.getElementById('inputTagContainer');
    container.innerHTML = '';
    availableTags.forEach(tag => {
      const chip = document.createElement('div');
      chip.className = 'tag-chip';
      chip.innerText = tag;
      chip.onclick = () => { chip.classList.toggle('active'); };
      container.appendChild(chip);
    });
  }

  function checkPendingData() {
    pendingData = rawData.filter(item => item.tagStr === '' || item.tagStr === '待處理' || item.tagStr.includes('待處理'));
    const section = document.getElementById('checkSection');
    const countEl = document.getElementById('checkCount');
    
    if (pendingData.length > 0) {
      section.classList.remove('hidden');
      countEl.innerText = `${pendingData.length} 筆`;
      renderPendingItem(pendingData[0]);
    } else {
      section.classList.add('hidden');
    }
  }

  function renderPendingItem(item) {
    const en = item.english || '';
    const zh = item.chinese || '';
    document.getElementById('checkTarget').innerText = `待確認：${en} (${zh})`;
    const container = document.getElementById('checkTagContainer');
    container.innerHTML = '';

    availableTags.forEach(tag => {
      const chip = document.createElement('div');
      chip.className = 'tag-chip';
      chip.innerText = tag;
      chip.onclick = () => { chip.classList.toggle('active'); };
      container.appendChild(chip);
    });
  }

  async function confirmTag() {
    if (pendingData.length === 0) return;
    const item = pendingData[0];
    const activeChips = document.querySelectorAll('#checkTagContainer .tag-chip.active');
    const selectedTags = Array.from(activeChips).map(c => c.innerText);
    const btn = document.getElementById('btnConfirm');
    
    btn.innerText = '更新中...';
    btn.disabled = true;

    try {
      await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ 
          action: 'updateTags', 
          english: item.english, 
          tags: selectedTags 
        })
      });
      loadSheetData();
    } catch(e) {
      alert('更新失敗');
    } finally {
      btn.disabled = false;
      btn.innerText = '確認並更新標籤';
    }
  }

  function switchTab(tab) {
    currentTab = tab;
    document.getElementById('btn-tab-listen').classList.toggle('active', tab === 'listen');
    document.getElementById('btn-tab-read').classList.toggle('active', tab === 'read');
    document.getElementById('listenSection').classList.toggle('hidden', tab !== 'listen');
    document.getElementById('readSection').classList.toggle('hidden', tab !== 'read');
    
    document.getElementById('weakOnlyRow').classList.toggle('hidden', tab === 'read');
    applyFilters();
  }

  function toggleReadField(field) {
    if (field === 'en') {
      showReadEn = !showReadEn;
      const chip = document.getElementById('toggleReadEn');
      chip.classList.toggle('active', showReadEn);
      chip.innerText = showReadEn ? '👁️ 顯示英文' : '🙈 隱藏英文';
    } else if (field === 'zh') {
      showReadZh = !showReadZh;
      const chip = document.getElementById('toggleReadZh');
      chip.classList.toggle('active', showReadZh);
      chip.innerText = showReadZh ? '👁️ 顯示中文' : '🙈 隱藏中文';
    }
    renderReadList();
  }

  function changeTypeFilter(type) {
    selectedTypeFilter = type;
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(type === 'all' ? 'type-all' : `type-${type === '單字' ? 'word' : type === '片語' ? 'phrase' : 'sentence'}`).classList.add('active');
    applyFilters();
  }

  function changeDisplayMode(mode) {
    displayMode = mode;
    ['en-zh', 'en-only', 'zh-only', 'blind'].forEach(m => {
      const btnId = m === 'en-zh' ? 'mode-en-zh' : m === 'en-only' ? 'mode-en-only' : m === 'zh-only' ? 'mode-zh-only' : 'mode-blind';
      document.getElementById(btnId).classList.remove('active');
    });
    const activeBtnId = mode === 'en-zh' ? 'mode-en-zh' : mode === 'en-only' ? 'mode-en-only' : mode === 'zh-only' ? 'mode-zh-only' : 'mode-blind';
    document.getElementById(activeBtnId).classList.add('active');
    renderCard();
  }

  function changeSort(sortType) {
    currentSort = sortType;
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`sort-${sortType}`).classList.add('active');
    applyFilters();
  }

  function getItemType(enText) {
    const text = (enText || '').trim();
    const hasSpace = text.includes(' ');
    const hasPunctuation = /[.?!,;:]/.test(text);
    const wordCount = text.split(/\s+/).length;

    if (!hasSpace && wordCount === 1) {
      return '單字';
    } else if (hasSpace && wordCount <= 4 && !hasPunctuation) {
      return '片語';
    } else {
      return '句子';
    }
  }

  function applyFilters() {
    const checkbox = document.getElementById('weakOnlyCheckbox');
    const isWeakOnly = (currentTab === 'listen') && checkbox && checkbox.checked;

    filteredData = rawData.filter(item => {
      if (isWeakOnly && item.star >= 4) return false;

      if (selectedTypeFilter !== 'all') {
        const inferredType = getItemType(item.english);
        if (inferredType !== selectedTypeFilter) return false;
      }

      const keyword = document.getElementById('searchInput').value.toLowerCase();
      if (keyword) {
        const en = (item.english || '').toLowerCase();
        const zh = (item.chinese || '').toLowerCase();
        const tag = (item.tagStr || '').toLowerCase();
        if (!en.includes(keyword) && !zh.includes(keyword) && !tag.includes(keyword)) return false;
      }
      return true;
    });

    if (currentSort === 'asc') {
      filteredData.sort((a, b) => a.star - b.star);
    } else if (currentSort === 'desc') {
      filteredData.sort((a, b) => b.star - a.star);
    } else if (currentSort === 'az') {
      filteredData.sort((a, b) => (a.english || '').localeCompare(b.english || ''));
    } else if (currentSort === 'za') {
      filteredData.sort((a, b) => (b.english || '').localeCompare(a.english || ''));
    } else if (currentSort === 'random') {
      filteredData.sort(() => Math.random() - 0.5);
    } else {
      filteredData.sort((a, b) => a.originalIndex - b.originalIndex);
    }

    currentIndex = 0;
    renderCard();
    renderReadList();
  }

  function renderCard() {
    if (filteredData.length === 0) {
      document.getElementById('textEn').innerText = '無符合資料';
      document.getElementById('textZh').innerText = '--';
      document.getElementById('textStar').innerHTML = '☆☆☆☆☆';
      document.getElementById('infoText').innerText = '第 0 / 0 筆';
      return;
    }
    const item = filteredData[currentIndex];
    const enEl = document.getElementById('textEn');
    const zhEl = document.getElementById('textZh');

    if (displayMode === 'en-zh') {
      enEl.innerText = item.english || '';
      zhEl.innerText = item.chinese || '';
      enEl.style.display = 'block';
      zhEl.style.display = 'block';
    } else if (displayMode === 'en-only') {
      enEl.innerText = item.english || '';
      zhEl.innerText = '';
      enEl.style.display = 'block';
      zhEl.style.display = 'none';
    } else if (displayMode === 'zh-only') {
      enEl.innerText = '';
      zhEl.innerText = item.chinese || '';
      enEl.style.display = 'none';
      zhEl.style.display = 'block';
    } else if (displayMode === 'blind') {
      enEl.innerText = '🔒 盲聽模式（隱藏文字）';
      zhEl.innerText = '🔒 盲聽模式（隱藏中文）';
      enEl.style.display = 'block';
      enEl.style.display = 'block';
    }
    
    const starContainer = document.getElementById('textStar');
    starContainer.innerHTML = '';
    for (let i = 1; i <= 5; i++) {
      const span = document.createElement('span');
      span.innerText = i <= item.star ? '★' : '☆';
      span.style.cursor = 'pointer';
      span.title = `將熟悉度設為 ${i} 星`;
      span.onclick = () => updateStar(i);
      starContainer.appendChild(span);
    }

    document.getElementById('infoText').innerText = `第 ${currentIndex + 1} / ${filteredData.length} 筆`;
  }

  async function updateStar(newStar) {
    if (filteredData.length === 0) return;
    const item = filteredData[currentIndex];
    const targetId = item.ID;

    item.star = newStar;
    renderCard();
    renderReadList();

    try {
      await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ 
          action: 'updateStar', 
          id: targetId, 
          star: newStar 
        })
      });
    } catch (e) {
      console.error('熟悉度同步至試算表失敗', e);
    }
  }

  function renderReadList() {
    const listContainer = document.getElementById('readList');
    listContainer.innerHTML = '';
    document.getElementById('dataCountText').innerText = `共 ${filteredData.length} 筆資料`;
    
    if (filteredData.length === 0) {
      listContainer.innerHTML = '<div style="text-align: center; color: #94a3b8; padding: 20px;">沒有找到相關資料</div>';
      return;
    }

    filteredData.forEach((item, index) => {
      const en = item.english || '';
      const zh = item.chinese || '';
      const cat = item.tagStr || '待處理';
      
      const div = document.createElement('div');
      div.className = 'read-item';

      let enHtml = showReadEn ? `<div class="en">${index + 1}. ${en}</div>` : `<div class="en" style="color: #cbd5e1; font-style: italic;">[英文已隱藏]</div>`;
      let zhHtml = showReadZh ? `<div class="zh">${zh}</div>` : `<div class="zh" style="color: #cbd5e1; font-style: italic;">[中文已隱藏]</div>`;

      div.innerHTML = `
        <div class="read-content">
          ${enHtml}
          ${zhHtml}
          <div class="meta">
            <span>🏷️ ${cat}</span>
            <span>⭐ ${item.star}星</span>
          </div>
        </div>
        <div class="read-actions-row">
          <button class="read-speak-btn" onclick="playSingleSentence('${en.replace(/'/g, "\\'")}')">🔊 發音</button>
          <button class="read-ai-btn" onclick="openAiModal('${en.replace(/'/g, "\\'")}', '${zh.replace(/'/g, "\\'")}', '${cat}')">✨ AI 衍生</button>
        </div>
      `;
      listContainer.appendChild(div);
    });
  }

  function playSingleSentence(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    
    const voices = window.speechSynthesis.getVoices();
    const preferredVoice =
      voices.find(v => v.lang === 'en-US' && /Google US English/i.test(v.name)) ||
      voices.find(v => v.lang === 'en-US' && /Samantha|Alex|Daniel/i.test(v.name)) ||
      voices.find(v => /^en-US$/i.test(v.lang)) ||
      voices.find(v => /^en/i.test(v.lang));

    if (preferredVoice) {
      utterance.voice = preferredVoice;
      utterance.lang = preferredVoice.lang;
    } else {
      utterance.lang = 'en-US';
    }
    utterance.rate = playbackSpeed;
    window.speechSynthesis.speak(utterance);
  }

  // AI 智慧衍生功能邏輯
  async function openAiModal(enText, zhText, tagText) {
    const overlay = document.getElementById('aiModalOverlay');
    const content = document.getElementById('aiModalContent');
    overlay.classList.remove('hidden');
    content.innerHTML = `<div class="ai-loading">正在針對「${enText}」透過 AI 產生相關與相反例句，請稍候...</div>`;

    try {
      // 這裡您可以串接真實的免費 API (例如 Gemini API 或自訂 GAS 端點轉發)。此處以介面內建模擬與提示詞生成結構示範：
      // 實際專案中可透過 fetch 呼叫您的 Google Apps Script 進行 AI 生成
      const aiResult = await simulateAiGeneration(enText, zhText);
      renderAiModalContent(aiResult, tagText);
    } catch (err) {
      content.innerHTML = `<div class="status-msg">AI 生成失敗，請稍後再試。</div>`;
    }
  }

  function closeAiModal() {
    document.getElementById('aiModalOverlay').classList.add('hidden');
  }

  // 模擬前端AI生成（您可以替換成實際呼叫您的 GAS AI 函數）
  async function simulateAiGeneration(en, zh) {
    return new Promise((resolve) => {
      setTimeout(() => {
        // 根據不同詞彙回傳 3 個相關延伸句與 1 個相反對比句
        resolve({
          source: en,
          related: [
            { en: `It's important to understand ${en.toLowerCase()}.`, zh: `理解${zh}是很重要的。` },
            { en: `She tried her best regarding ${en.toLowerCase()}.`, zh: `關於${zh}，她盡了最大努力。` },
            { en: `Everyone should know more about ${en.toLowerCase()}.`, zh: `每個人都應該對${zh}了解更多。` }
          ],
          opposite: { en: `Unlike ${en.toLowerCase()}, things are different here.`, zh: `與${zh}不同，這裡的情況有所不同。` }
        });
      }, 1000);
    });
  }

  function renderAiModalContent(data, defaultTag) {
    const content = document.getElementById('aiModalContent');
    let html = `<div style="font-size: 13px; color: #64748b; margin-bottom: 12px;">來源詞彙：<b style="color:#1e293b;">${data.source}</b></div>`;
    
    html += `<div class="ai-section-title">🔗 3 個相關延伸句</div>`;
    data.related.forEach((item, idx) => {
      html += `
        <div class="ai-suggestion-card" id="sug-rel-${idx}">
          <div class="ai-suggestion-info">
            <div class="ai-sug-en">${item.en}</div>
            <div class="ai-sug-zh">${item.zh}</div>
          </div>
          <button class="ai-add-btn" onclick="collectAiItem(this, '${item.en.replace(/'/g, "\\'")}', '${item.zh.replace(/'/g, "\\'")}', '${defaultTag}')">＋ 收藏</button>
        </div>
      `;
    });

    html += `<div class="ai-section-title" style="margin-top: 15px;">⚡ 1 個相反對比句</div>`;
    html += `
      <div class="ai-suggestion-card" id="sug-opp">
        <div class="ai-suggestion-info">
          <div class="ai-sug-en">${data.opposite.en}</div>
          <div class="ai-sug-zh">${data.opposite.zh}</div>
        </div>
        <button class="ai-add-btn" onclick="collectAiItem(this, '${data.opposite.en.replace(/'/g, "\\'")}', '${data.opposite.zh.replace(/'/g, "\\'")}', '${defaultTag}')">＋ 收藏</button>
      </div>
    `;

    content.innerHTML = html;
  }

  // 一鍵收藏：寫入後端試算表
  async function collectAiItem(btnElement, en, zh, tag) {
    btnElement.innerText = '收藏中...';
    btnElement.disabled = true;

    try {
      await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ 
          action: 'addEnglish', 
          english: en, 
          chinese: zh, 
          tags: [tag] 
        })
      });
      btnElement.innerText = '✓ 已收藏';
      btnElement.style.background = '#10b981';
      loadSheetData(); // 重新載入資料庫
    } catch (e) {
      btnElement.innerText = '收藏失敗';
      btnElement.disabled = false;
      alert('寫入資料庫失敗');
    }
  }

  function setRepeat(n) {
    repeatCount = n;
    ['1', '2', '3', 'inf'].forEach(id => document.getElementById(`rep-${id}`).classList.remove('active'));
    document.getElementById(`rep-${n === 99 ? 'inf' : n}`).classList.add('active');
  }

  function setSpeed(spd) {
    playbackSpeed = parseFloat(spd);

    ['0.4', '0.6', '0.8', '1.0'].forEach(s => {
      const btn = document.getElementById(`spd-${s}`);
      if (btn) btn.classList.remove('active');
    });

    const speedKey = Number(spd).toFixed(1);
    const activeBtn = document.getElementById(`spd-${speedKey}`);
    if (activeBtn) activeBtn.classList.add('active');

    if (playerState === 'playing') {
      window.speechSynthesis.cancel();
      if (speechTimer) {
        clearTimeout(speechTimer);
        speechTimer = null;
      }
      playSpeechSequence();
    }
  }

  function setPlayMode(mode) {
    if (playMode === mode) {
      playMode = 'single';
    } else {
      playMode = mode;
    }

    document.getElementById('btnContinuous').classList.toggle('active', playMode === 'continuous');
    document.getElementById('btnRandomPlay').classList.toggle('active', playMode === 'random');
  }

  function setIntervalTime(sec) {
    intervalSeconds = sec;
    [1, 3].forEach(s => document.getElementById(`int-${s}`).classList.remove('active'));
    document.getElementById(`int-${sec}`).classList.add('active');
  }

  function updatePlayButtonUI(state) {
    const btn = document.getElementById('playBtn');
    if (state === 'playing') {
      btn.innerText = '⏸ 暫停';
      btn.style.background = '#f97316';
    } else if (state === 'paused') {
      btn.innerText = '▶ 繼續播放';
      btn.style.background = '#22c55e';
    } else {
      btn.innerText = '🔊 播放';
      btn.style.background = '#2563eb';
    }
  }

  function nextSentence() {
    if (filteredData.length === 0) return;
    if (playMode === 'random') {
      currentIndex = Math.floor(Math.random() * filteredData.length);
    } else {
      currentIndex = (currentIndex + 1) % filteredData.length;
    }
    renderCard();
    stopAudioCompletely();
    playerState = 'playing';
    updatePlayButtonUI('playing');
    playSpeechSequence();
  }

  function prevSentence() {
    if (filteredData.length === 0) return;
    currentIndex = (currentIndex - 1 + filteredData.length) % filteredData.length;
    renderCard();
    stopAudioCompletely();
    playerState = 'playing';
    updatePlayButtonUI('playing');
    playSpeechSequence();
  }

  function handlePlayToggle() {
    if (filteredData.length === 0) return;

    if (speechTimer) {
      clearTimeout(speechTimer);
      speechTimer = null;
    }

    if (playerState === 'playing') {
      window.speechSynthesis.cancel();
      playerState = 'paused';
      updatePlayButtonUI('paused');
    } else if (playerState === 'paused') {
      playerState = 'playing';
      updatePlayButtonUI('playing');
      playSpeechSequence();
    } else {
      playerState = 'playing';
      updatePlayButtonUI('playing');
      playSpeechSequence();
    }
  }

  function playSpeechSequence() {
    if (playerState !== 'playing' || filteredData.length === 0) return;
    const item = filteredData[currentIndex];
    const text = item.english || '';
    
    window.speechSynthesis.cancel();

    let currentPlayCount = 0;

    function speakOneTime() {
      if (playerState !== 'playing') return;

      currentUtterance = new SpeechSynthesisUtterance(text);

      const voices = window.speechSynthesis.getVoices();
      const preferredVoice =
        voices.find(v => v.lang === 'en-US' && /Google US English/i.test(v.name)) ||
        voices.find(v => v.lang === 'en-US' && /Samantha|Alex|Daniel/i.test(v.name)) ||
        voices.find(v => /^en-US$/i.test(v.lang)) ||
        voices.find(v => /^en/i.test(v.lang));

      if (preferredVoice) {
        currentUtterance.voice = preferredVoice;
        currentUtterance.lang = preferredVoice.lang;
      } else {
        currentUtterance.lang = 'en-US';
      }

      currentUtterance.rate = playbackSpeed;

      currentUtterance.onend = () => {
        if (playerState !== 'playing') return;
        currentPlayCount++;

        if (repeatCount === 99 || currentPlayCount < repeatCount) {
          speechTimer = setTimeout(() => {
            speakOneTime();
          }, 350);
        } else {
          if (playMode === 'continuous' || playMode === 'random') {
            if (playMode === 'random') {
              currentIndex = Math.floor(Math.random() * filteredData.length);
            } else {
              currentIndex = (currentIndex + 1) % filteredData.length;
            }
            renderCard();
            speechTimer = setTimeout(() => {
              if (playerState === 'playing') {
                playSpeechSequence();
              }
            }, intervalSeconds * 1000);
          } else {
            playerState = 'stopped';
            updatePlayButtonUI('default');
          }
        }
      };

      currentUtterance.onerror = () => {
        if (playerState !== 'playing') return;
        playerState = 'stopped';
        updatePlayButtonUI('default');
      };

      window.speechSynthesis.speak(currentUtterance);
    }

    speakOneTime();
  }

  function stopAudioCompletely() {
    window.speechSynthesis.cancel();
    if (speechTimer) {
      clearTimeout(speechTimer);
      speechTimer = null;
    }
    playerState = 'stopped';
    updatePlayButtonUI('default');
  }

  async function submitNewData() {
    const en = document.getElementById('inputEnglish').value.trim();
    const zh = document.getElementById('inputChinese').value.trim();
    const activeChips = document.querySelectorAll('#inputTagContainer .tag-chip.active');
    const tags = Array.from(activeChips).map(c => c.innerText);

    if (!en) {
      alert('請輸入英文內容');
      return;
    }
    try {
      await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ 
          action: 'addEnglish', 
          english: en, 
          chinese: zh, 
          tags: tags 
        })
      });
      alert('新增成功！');
      document.getElementById('inputEnglish').value = '';
      document.getElementById('inputChinese').value = '';
      document.querySelectorAll('#inputTagContainer .tag-chip').forEach(c => c.classList.remove('active'));
      loadSheetData();
    } catch(e) {
      alert('新增失敗');
    }
  }

  window.onload = loadSheetData;
</script>
</body>
