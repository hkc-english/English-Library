<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英文學習與情境標籤管理系統</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 700px; margin: 0 auto; padding: 20px; background-color: #f4f6f8; color: #333; }
        h2 { color: #2c3e50; border-bottom: 2px solid #ddd; padding-bottom: 8px; }
        .card { background: #fff; padding: 18px 20px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .english { font-size: 1.2em; font-weight: bold; color: #2980b9; margin-bottom: 5px; }
        .chinese { color: #555; margin-bottom: 12px; font-size: 1.05em; }
        select, button { padding: 8px 12px; margin-right: 8px; margin-bottom: 5px; border-radius: 4px; border: 1px solid #ccc; font-size: 0.95em; }
        button { background-color: #27ae60; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #219653; }
        .loading, .empty-msg { text-align: center; color: #7f8c8d; padding: 30px; font-size: 1.1em; background: #fff; border-radius: 8px; }
    </style>
</head>
<body>

    <h2>英文學習系統 - 待分類清單 ([待處理])</h2>
    <p style="color: #666; font-size: 0.95em;">這裡顯示所有從 Google 試算表快速輸入、等待精細分類的英文單字與句子：</p>
    
    <div id="todo-container">
        <div class="loading">載入中，正在連接試算表...</div>
    </div>

    <script>
        // 完整的豐富主標籤與次標籤對照表（涵蓋職場、社工、日常、醫療、動保、旅遊等）
        const categoryMap = {
            "職場行政": ["開會討論", "公文簽核", "財務會計", "出納管理", "人事行政", "電話溝通", "簡報報告", "email書信"],
            "社會工作": ["個案訪視", "福利諮詢", "資源連結", "家庭訪談", "政策法規", "危機處理", "紀錄撰寫"],
            "動物救援": ["浪貓照顧", "醫療照護", "餵食誘捕", "獸醫溝通", "送養協尋"],
            "日常社交": ["打招呼", "購物消費", "餐廳點餐", "問路交通", "天氣氣候", "居家生活", "朋友聊天", "情感表達"],
            "健康醫療": ["身體不適", "看診拿藥", "牙科治療", "用藥指示", "復健運動"],
            "休閒旅遊": ["機場海關", "飯店住宿", "景點觀光", "交通工具", "緊急狀況", "拍照打卡"]
        };

        // 頁面載入時取得待處理資料
        window.onload = function() {
            if (typeof google !== 'undefined' && google.script.run) {
                google.script.run
                    .withSuccessHandler(renderTodoList)
                    .withFailureHandler(function(err) {
                        document.getElementById('todo-container').innerHTML = '<p style="color:red;">載入失敗：' + err.message + '</p>';
                    })
                    .getPendingItems();
            } else {
                // 本地測試用模擬資料
                renderTodoList([
                    { row: 2, english: "I'm a people person.", chinese: "我是個很好相處的人。" },
                    { row: 3, english: "Could you elaborate on that?", chinese: "您能詳細說明一下嗎？" }
                ]);
            }
        };

        // 渲染清單
        function renderTodoList(items) {
            const container = document.getElementById('todo-container');
            container.innerHTML = '';

            if (!items || items.length === 0) {
                container.innerHTML = '<div class="empty-msg">太棒了！目前沒有需要處理的未分類資料，所有資料都很整齊！</div>';
                return;
            }

            items.forEach(item => {
                let card = document.createElement('div');
                card.className = 'card';
                card.id = 'row-' + item.row;

                let mainSelectOptions = '<option value="">請選擇主標籤</option>';
                for (let main in categoryMap) {
                    mainSelectOptions += `<option value="${main}">${main}</option>`;
                }

                card.innerHTML = `
                    <div class="english">${item.english}</div>
                    <div class="chinese">${item.chinese}</div>
                    <div style="margin-top: 10px;">
                        <select id="main-cat-${item.row}" onchange="updateSubCategories(${item.row})">
                            ${mainSelectOptions}
                        </select>
                        <select id="sub-cat-${item.row}">
                            <option value="">請先選主標籤</option>
                        </select>
                        <button onclick="saveCategory(${item.row})">確認儲存</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 主次標籤聯動
        function updateSubCategories(row) {
            const mainCat = document.getElementById(`main-cat-${row}`).value;
            const subSelect = document.getElementById(`sub-cat-${row}`);
            
            subSelect.innerHTML = '<option value="">請選擇次標籤</option>';
            
            if (categoryMap[mainCat]) {
                categoryMap[mainCat].forEach(sub => {
                    subSelect.innerHTML += `<option value="${sub}">${sub}</option>`;
                });
            }
        }

        // 儲存並寫回試算表
        function saveCategory(row) {
            const mainCat = document.getElementById(`main-cat-${row}`).value;
            const subCat = document.getElementById(`sub-cat-${row}`).value;

            if (!mainCat || !subCat) {
                alert('請完整選擇主標籤與次標籤！');
                return;
            }

            const finalTag = `${mainCat} / ${subCat}`;

            if (typeof google !== 'undefined' && google.script.run) {
                google.script.run
                    .withSuccessHandler(function() {
                        document.getElementById('row-' + row).remove();
                        if (document.getElementById('todo-container').children.length === 0) {
                            document.getElementById('todo-container').innerHTML = '<div class="empty-msg">太棒了！所有待處理資料已分類完成！</div>';
                        }
                    })
                    .withFailureHandler(function(err) {
                        alert('儲存失敗：' + err.message);
                    })
                    .updateItemCategory(row, finalTag);
            } else {
                alert(`[模擬] 第 ${row} 行已成功更新標籤為：${finalTag}`);
                document.getElementById('row-' + row).remove();
            }
        }
    </script>
</body>
</html>
