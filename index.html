<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英文學習資料庫</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f1f5f9; margin: 0; padding: 12px; color: #1e293b; }
    .container { max-width: 720px; margin: 0 auto; background: #ffffff; padding: 16px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    
    header { text-align: center; margin-bottom: 12px; }
    h1 { font-size: 1.4rem; margin: 0 0 8px 0; color: #0f172a; }

    /* 模式切換按鈕 */
    .mode-switcher { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; }
    .mode-btn { flex: 1; padding: 8px 12px; border: 2px solid #2563eb; background: #fff; color: #2563eb; font-weight: bold; border-radius: 8px; cursor: pointer; text-align: center; font-size: 0.95rem; }
    .mode-btn.active { background: #2563eb; color: #fff; }

    /* 篩選控制面板 */
    .filter-panel { background: #f8fafc; border: 1px solid #e2e8f0; padding: 10px; border-radius: 10px; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
    .filter-group { display: flex; align-items: center; gap: 4px; font-size: 0.85rem; font-weight: bold; color: #475569; }
    select, input[type="text"] { padding: 6px 10px; border-radius: 6px; border: 1px solid #cbd5e1; outline: none; font-size: 0.85rem; }
    input[type="text"] { flex: 1; min-width: 140px; }

    /* 卡片（聽力模式） */
    .card { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px; padding: 20px 16px; text-align: center; min-height: 140px; display: flex; flex-direction: column; justify-content: center; align-items: center; margin-bottom: 12px; }
    .card-en { font-size: 1.25rem; font-weight: bold; color: #1e293b; margin-bottom: 8px; line-height: 1.4; }
    .card-zh { font-size: 1.05rem; color: #475569; margin-top: 4px; line-height: 1.4; }
    .count-info { font-size: 0.8rem; color: #64748b; margin-bottom: 8px; text-align: center; }

    /* 星星打分 */
    .stars { display: flex; gap: 6px; justify-content: center; margin-top: 8px; }
    .star { font-size: 1.4rem; color: #cbd5e1; cursor: pointer; transition: color 0.1s; }
    .star.active { color: #f59e0b; }

    /* 控制按鈕專區 */
    .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 12px; }
    .btn { padding: 8px 14px; border: none; border-radius: 8px; font-weight: bold; font-size: 0.88rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; background: #e2e8f0; color: #334155; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-warning { background: #eab308; color: white; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-active { background: #000; color: white; }

    /* 重複次數面板 */
    .repeat-panel { background: #f1f5f9; padding: 8px; border-radius: 10px; text-align: center; font-size: 0.8rem; font-weight: bold; color: #475569; margin-bottom: 12px; }
    .repeat-btns { display: flex; gap: 4px; justify-content: center; margin-top: 6px; }
    .btn-sm { padding: 4px 8px; border: 1px solid #cbd5e1; border-radius: 6px; background: white; font-size: 0.8rem; cursor: pointer; }
    .btn-sm.active { background: #2563eb; color: white; border-color: #2563eb; }

    /* 閱讀模式專屬清單 */
    .read-list { display: flex; flex-direction: column; gap: 10px; max-height: 65vh; overflow-y: auto; padding-right: 4px; }
    .read-item { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .read-content { flex: 1; }
    .read-en { font-size: 1rem; font-weight: bold; color: #1e293b; margin-bottom: 2px; }
    .read-zh { font-size: 0.9rem; color: #475569; }
    .read-star-btn { font-size: 1.2rem; color: #cbd5e1; cursor: pointer; border: none; background: none; }
    .read-star-btn.active { color: #f59e0b; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>📚 英文學習資料庫</h1>
    <!-- 模式切換按鈕 -->
    <div class="mode-switcher">
      <button id="btnModeAudio" class="mode-btn active" onclick="switchMode('audio')">🎧 聽力模式</button>
      <button id="btnModeRead" class="mode-btn" onclick="switchMode('read')">📖 閱讀模式</button>
    </div>
  </header>

  <!-- 篩選控制面板 -->
  <div class="filter-panel">
    <div class="filter-group">
      <label>🎯 範圍：</label>
      <select id="filterScope" onchange="applyFilters()">
        <option value="all">全部顯示</option>
        <option value="star1">1 星以上</option>
        <option value="star2">2 星以上</option>
        <option value="star3">3 星以上</option>
        <option value="star4">4 星以上</option>
        <option value="star5">5 星（已精通）</option>
        <option value="unrated">未評分</option>
      </select>
    </div>

    <div class="filter-group" style="flex:1;">
      <label>🔍 搜尋：</label>
      <input type="text" id="searchInput" placeholder="輸入英/中文關鍵字..." oninput="applyFilters()">
    </div>
  </div>

  <!-- 【聽力模式區域】 -->
  <div id="audioSection">
    <div class="count-info" id="countInfo">載入中...</div>

    <div class="controls">
      <button class="btn" id="btnDisplayEn" onclick="setDisplayMode('en')">英文</button>
      <button class="btn" id="btnDisplayZh" onclick="setDisplayMode('zh')">中文</button>
      <button class="btn" id="btnDisplayBoth" onclick="setDisplayMode('both')">英＋中</button>
      <button class="btn" id="btnDisplayBlind" onclick="setDisplayMode('blind')">盲聽</button>
    </div>

    <div class="card">
      <div id="cardEn" class="card-en">--</div>
      <div id="cardZh" class="card-zh">--</div>
      <div class="stars" id="starContainer">
        <span class="star" onclick="setRating(1)">★</span>
        <span class="star" onclick="setRating(2)">★</span>
        <span class="star" onclick="setRating(3)">★</span>
        <span class="star" onclick="setRating(4)">★</span>
        <span class="star" onclick="setRating(5)">★</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn" onclick="prevCard()">⇦ 上一句</button>
      <button class="btn btn-primary" id="btnPlay" onclick="playAudio()">🔊 播放</button>
      <button class="btn" onclick="nextCard()">下一句 ⇨</button>
    </div>

    <div class="controls">
      <button class="btn btn-warning" onclick="pauseAudio()">⏸ 暫停</button>
      <button class="btn btn-danger" onclick="stopAudio()">⏹ 停止</button>
    </div>

    <div class="repeat-panel">
      單句重複次數
      <div class="repeat-btns">
        <button class="btn-sm active" id="rep1" onclick="setRepeat(1)">1次</button>
        <button class="btn-sm" id="rep2" onclick="setRepeat(2)">2次</button>
        <button class="btn-sm" id="rep3" onclick="setRepeat(3)">3次</button>
        <button class="btn-sm" id="rep4" onclick="setRepeat(4)">4次</button>
        <button class="btn-sm" id="rep5" onclick="setRepeat(5)">5次</button>
        <button class="btn-sm" id="repInf" onclick="setRepeat(999)">無限</button>
      </div>
    </div>
  </div>

  <!-- 【閱讀模式區域】 -->
  <div id="readSection" class="hidden">
    <div class="count-info" id="readCountInfo">共 0 筆</div>
    <div class="read-list" id="readList"></div>
  </div>
</div>

<script>
  let allData = [];
  let filteredData = [];
  let currentIndex = 0;
  let currentDisplay = 'en'; // en, zh, both, blind
  let repeatTimes = 1;
  let currentRepeatCount = 0;
  let isPlaying = false;
  let currentMode = 'audio'; // audio, read

  // 載入 localStorage 星星紀錄
  let ratings = JSON.parse(localStorage.getItem('english_ratings') || '{}');

  // 初始化載入 JSON
  fetch('data.json')
    .then(res => {
      if(!res.ok) throw new Error('網路錯誤');
      return res.json();
    })
    .then(data => {
      allData = data;
      applyFilters();
    })
    .catch(err => {
      document.getElementById('countInfo').innerText = '資料載入失敗，請確認 data.json 檔案是否存在';
      console.error(err);
    });

  // 模式切換
  function switchMode(mode) {
    currentMode = mode;
    stopAudio();
    if(mode === 'audio') {
      document.getElementById('btnModeAudio').classList.add('active');
      document.getElementById('btnModeRead').classList.remove('active');
      document.getElementById('audioSection').classList.remove('hidden');
      document.getElementById('readSection').classList.add('hidden');
      updateCard();
    } else {
      document.getElementById('btnModeRead').classList.add('active');
      document.getElementById('btnModeAudio').classList.remove('active');
      document.getElementById('readSection').classList.remove('hidden');
      document.getElementById('audioSection').classList.add('hidden');
      renderReadList();
    }
  }

  // 篩選邏輯
  function applyFilters() {
    const scope = document.getElementById('filterScope').value;
    const keyword = document.getElementById('searchInput').value.toLowerCase().trim();

    filteredData = allData.filter(item => {
      const star = ratings[item.id] || 0;
      
      // 依星級篩選
      if(scope === 'star1' && star < 1) return false;
      if(scope === 'star2' && star < 2) return false;
      if(scope === 'star3' && star < 3) return false;
      if(scope === 'star4' && star < 4) return false;
      if(scope === 'star5' && star !== 5) return false;
      if(scope === 'unrated' && star !== 0) return false;

      // 依關鍵字搜尋
      if(keyword) {
        const matchEn = item.en && item.en.toLowerCase().includes(keyword);
        const matchZh = item.zh && item.zh.toLowerCase().includes(keyword);
        if(!matchEn && !matchZh) return false;
      }

      return true;
    });

    currentIndex = 0;
    if(currentMode === 'audio') {
      updateCard();
    } else {
      renderReadList();
    }
  }

  // 更新聽力模式卡片
  function updateCard() {
    const total = filteredData.length;
    const countInfo = document.getElementById('countInfo');

    if(total === 0) {
      countInfo.innerText = '沒有符合條件的項目';
      document.getElementById('cardEn').innerText = '--';
      document.getElementById('cardZh').innerText = '--';
      renderStars(0);
      return;
    }

    countInfo.innerText = `第 ${currentIndex + 1} / ${total} 筆 [${filteredData[currentIndex].type || '句子'}]`;
    const item = filteredData[currentIndex];

    const cardEn = document.getElementById('cardEn');
    const cardZh = document.getElementById('cardZh');

    cardEn.innerText = (currentDisplay === 'zh') ? '🙈 (隱藏英文)' : item.en;
    cardZh.innerText = (currentDisplay === 'en' || currentDisplay === 'blind') ? '' : item.zh;

    renderStars(ratings[item.id] || 0);
    updateDisplayButtons();
  }

  // 渲染星級打分
  function renderStars(rating) {
    const stars = document.querySelectorAll('#starContainer .star');
    stars.forEach((star, idx) => {
      if(idx < rating) {
        star.classList.add('active');
      } else {
        star.classList.remove('active');
      }
    });
  }

  function setRating(rating) {
    if(filteredData.length === 0) return;
    const item = filteredData[currentIndex];
    ratings[item.id] = rating;
    localStorage.setItem('english_ratings', JSON.stringify(ratings));
    renderStars(rating);
  }

  // 顯示模式切換（英文、中文、英+中、盲聽）
  function setDisplayMode(mode) {
    currentDisplay = mode;
    updateCard();
  }

  function updateDisplayButtons() {
    ['en', 'zh', 'both', 'blind'].forEach(m => {
      const btn = document.getElementById('btnDisplay' + m.charAt(0).toUpperCase() + m.slice(1));
      if(btn) {
        if(currentDisplay === m) btn.classList.add('btn-active');
        else btn.classList.remove('btn-active');
      }
    });
  }

  // 重複播放設置
  function setRepeat(times) {
    repeatTimes = times;
    ['1','2','3','4','5','Inf'].forEach(t => {
      const id = 'rep' + t;
      const el = document.getElementById(id);
      if(el) el.classList.remove('active');
    });
    const activeId = times === 999 ? 'repInf' : 'rep' + times;
    document.getElementById(activeId).classList.add('active');
  }

  // 語音播放控制 (Web Speech API)
  function playAudio() {
    if(filteredData.length === 0) return;
    stopAudio();

    const item = filteredData[currentIndex];
    const utterance = new SpeechSynthesisUtterance(item.en);
    utterance.lang = 'en-US';
    utterance.rate = 0.9;

    isPlaying = true;

    utterance.onend = () => {
      currentRepeatCount++;
      if(currentRepeatCount < repeatTimes) {
        window.speechSynthesis.speak(utterance);
      } else {
        isPlaying = false;
        currentRepeatCount = 0;
      }
    };

    currentRepeatCount = 0;
    window.speechSynthesis.speak(utterance);
  }

  function pauseAudio() {
    if(window.speechSynthesis.speaking) {
      window.speechSynthesis.pause();
    }
  }

  function stopAudio() {
    window.speechSynthesis.cancel();
    isPlaying = false;
    currentRepeatCount = 0;
  }

  function nextCard() {
    if(filteredData.length === 0) return;
    stopAudio();
    if(currentIndex < filteredData.length - 1) {
      currentIndex++;
      updateCard();
    }
  }

  function prevCard() {
    if(filteredData.length === 0) return;
    stopAudio();
    if(currentIndex > 0) {
      currentIndex--;
      updateCard();
    }
  }

  // 渲染閱讀模式列表
  function renderReadList() {
    const listEl = document.getElementById('readList');
    const countInfo = document.getElementById('readCountInfo');
    listEl.innerHTML = '';

    countInfo.innerText = `共 ${filteredData.length} 筆`;

    if(filteredData.length === 0) {
      listEl.innerHTML = '<div style="text-align:center; color:#64748b; padding:20px;">沒有符合條件的內容</div>';
      return;
    }

    filteredData.forEach(item => {
      const div = document.createElement('div');
      div.className = 'read-item';
      const star = ratings[item.id] || 0;

      div.innerHTML = `
        <div class="read-content">
          <div class="read-en">${item.en}</div>
          <div class="read-zh">${item.zh}</div>
        </div>
        <button class="read-star-btn ${star > 0 ? 'active' : ''}" onclick="toggleReadStar('${item.id}', this)">
          ★
        </button>
      `;
      listEl.appendChild(div);
    });
  }

  function toggleReadStar(id, btn) {
    let current = ratings[id] || 0;
    let next = current >= 5 ? 0 : current + 1;
    ratings[id] = next;
    localStorage.setItem('english_ratings', JSON.stringify(ratings));
    if(next > 0) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  }
  
</script>
</body>
</html>
