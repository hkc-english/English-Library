<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英文學習資料庫</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f0f4f8; margin: 0; padding: 20px; color: #333; display: flex; justify-content: center; }
    .container { max-width: 800px; width: 100%; background: #fff; padding: 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h1 { text-align: center; color: #1e293b; font-size: 24px; margin-bottom: 20px; }
    
    .tab-group { display: flex; gap: 12px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 12px; font-size: 16px; font-weight: bold; border: 2px solid #2563eb; background: #fff; color: #2563eb; border-radius: 10px; cursor: pointer; transition: all 0.2s; }
    .tab-btn.active { background: #2563eb; color: #fff; }

    .filter-card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 16px; border-radius: 12px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .filter-item { display: flex; align-items: center; gap: 6px; font-size: 14px; color: #475569; font-weight: 600; }
    select, input[type="text"] { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; }
    input[type="text"] { flex: 1; min-width: 180px; }

    .content-box { min-height: 200px; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; margin-bottom: 20px; background: #fafafa; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
    .text-en { font-size: 22px; font-weight: 700; color: #0f172a; margin-bottom: 12px; line-height: 1.4; }
    .text-zh { font-size: 16px; color: #64748b; margin-bottom: 12px; }
    .star-rating { color: #f59e0b; font-size: 20px; }

    .display-mode-btns { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; }
    .mode-btn { padding: 8px 16px; border: none; background: #e2e8f0; color: #475569; font-radius: 8px; font-weight: bold; cursor: pointer; border-radius: 8px; }
    .mode-btn.active { background: #2563eb; color: #fff; }

    .control-group { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .btn { padding: 10px 18px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 15px; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-warning { background: #eab308; color: #fff; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .repeat-group { display: flex; justify-content: center; align-items: center; gap: 6px; background: #f1f5f9; padding: 12px; border-radius: 10px; }
    .repeat-label { font-size: 13px; font-weight: bold; color: #475569; margin-right: 6px; }
    .repeat-btn { padding: 6px 10px; border: 1px solid #cbd5e1; background: #fff; border-radius: 6px; font-size: 13px; cursor: pointer; }
    .repeat-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }

    /* 閱讀模式列表 */
    .read-list { display: flex; flex-direction: column; gap: 12px; }
    .read-item { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 16px; text-align: left; }
    .read-item .en { font-size: 18px; font-weight: bold; color: #1e293b; margin-bottom: 6px; }
    .read-item .zh { font-size: 14px; color: #64748b; }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <h1>📚 英文學習資料庫</h1>

  <!-- 模式分頁按鈕 -->
  <div class="tab-group">
    <button class="tab-btn active" id="btn-tab-listen" onclick="switchTab('listen')">🎧 聽力模式</button>
    <button class="tab-btn" id="btn-tab-read" onclick="switchTab('read')">📖 閱讀模式</button>
  </div>

  <!-- 篩選卡片 -->
  <div class="filter-card">
    <div class="filter-item">
      🎯 範圍：
      <select id="categorySelect" onchange="applyFilters()">
        <option value="全部顯示">全部顯示</option>
      </select>
    </div>
    <div class="filter-item" style="flex: 1;">
      🔍 搜尋：
      <input type="text" id="searchInput" placeholder="輸入英/中文關鍵字..." oninput="applyFilters()">
    </div>
  </div>

  <div id="loadingText" style="text-align:center; padding: 20px; color: #64748b;">正在連線連動 Google Sheet 資料中...</div>

  <!-- 聽力模式區塊 -->
  <div id="listenSection">
    <div class="display-mode-btns">
      <button class="mode-btn active" id="disp-all" onclick="setDisplayMode('all')">英文 + 中文</button>
      <button class="mode-btn" id="disp-en" onclick="setDisplayMode('en')">僅英文</button>
      <button class="mode-btn" id="disp-zh" onclick="setDisplayMode('zh')">僅中文</button>
      <button class="mode-btn" id="disp-blind" onclick="setDisplayMode('blind')">盲聽 (隱藏)</button>
    </div>

    <div class="content-box">
      <div class="text-en" id="textEn">--</div>
      <div class="text-zh" id="textZh">--</div>
      <div class="star-rating" id="textStar">★★★★★</div>
    </div>

    <div class="control-group">
      <button class="btn btn-secondary" onclick="prevSentence()">⇐ 上一句</button>
      <button class="btn btn-primary" id="playBtn" onclick="togglePlay()">🔊 播放</button>
      <button class="btn btn-secondary" onclick="nextSentence()">下一句 ⇒</button>
    </div>

    <div class="control-group">
      <button class="btn btn-warning" onclick="pauseAudio()">⏸ 暫停</button>
      <button class="btn btn-danger" onclick="stopAudio()">■ 停止</button>
    </div>

    <div class="repeat-group">
      <span class="repeat-label">單句重複次數：</span>
      <button class="repeat-btn active" onclick="setRepeat(1, this)">1次</button>
      <button class="repeat-btn" onclick="setRepeat(2, this)">2次</button>
      <button class="repeat-btn" onclick="setRepeat(3, this)">3次</button>
      <button class="repeat-btn" onclick="setRepeat(5, this)">5次</button>
      <button class="repeat-btn" onclick="setRepeat(999, this)">無限</button>
    </div>
  </div>

  <!-- 閱讀模式區塊 -->
  <div id="readSection" class="hidden">
    <div id="readCount" style="margin-bottom: 12px; font-weight: bold; color: #475569;">共 0 筆</div>
    <div class="read-list" id="readList"></div>
  </div>

</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AQ.Ab8RN6KgyUgZLWVCZyKrP0QbBK1Iszxkoz0-XFr3-WxG1R5OAQ/exec';

  let rawData = [];
  let filteredData = [];
  let currentIndex = 0;
  let displayMode = 'all'; 
  let repeatTimes = 1;
  let currentRepeatCount = 0;
  let isPlaying = false;

  const synth = window.speechSynthesis;
  let utterance = null;

  async function loadSheetData() {
    try {
      const res = await fetch(API_URL);
      rawData = await res.json();
      document.getElementById('loadingText').classList.add('hidden');
      
      initCategories();
      applyFilters();
    } catch (err) {
      document.getElementById('loadingText').innerText = '❌ 資料載入失敗，請確認 Google Sheet API 存取權是否設定為「所有人」。';
      console.error(err);
    }
  }

  function initCategories() {
    const categories = new Set();
    rawData.forEach(item => {
      if (item.category || item.分類) categories.add(item.category || item.分類);
    });

    const select = document.getElementById('categorySelect');
    select.innerHTML = '<option value="全部顯示">全部顯示</option>';
    categories.forEach(cat => {
      const opt = document.createElement('option');
      opt.value = cat;
      opt.innerText = cat;
      select.appendChild(opt);
    });
  }

  function applyFilters() {
    const selectedCat = document.getElementById('categorySelect').value;
    const keyword = document.getElementById('searchInput').value.toLowerCase().trim();

    filteredData = rawData.filter(item => {
      const cat = item.category || item.分類 || '';
      const en = item.english || item.英文 || '';
      const zh = item.chinese || item.中文 || '';

      const matchCat = (selectedCat === '全部顯示') || (cat === selectedCat);
      const matchKey = !keyword || en.toLowerCase().includes(keyword) || zh.includes(keyword);

      return matchCat && matchKey;
    });

    currentIndex = 0;
    renderCurrentSentence();
    renderReadList();
  }

  function renderCurrentSentence() {
    if (filteredData.length === 0) {
      document.getElementById('textEn').innerText = '沒有符合條件的資料';
      document.getElementById('textZh').innerText = '';
      document.getElementById('textStar').innerText = '';
      return;
    }

    const item = filteredData[currentIndex];
    const en = item.english || item.英文 || '';
    const zh = item.chinese || item.中文 || '';
    const star = parseInt(item.star || item.星級 || item.評價 || 0);

    const enEl = document.getElementById('textEn');
    const zhEl = document.getElementById('textZh');

    enEl.innerText = (displayMode === 'zh' || displayMode === 'blind') ? '•••' : en;
    zhEl.innerText = (displayMode === 'en' || displayMode === 'blind') ? '•••' : zh;
    document.getElementById('textStar').innerText = star > 0 ? '★'.repeat(star) + '☆'.repeat(5 - star) : '';
  }

  function renderReadList() {
    const listContainer = document.getElementById('readList');
    document.getElementById('readCount').innerText = `共 ${filteredData.length} 筆`;
    listContainer.innerHTML = '';

    if (filteredData.length === 0) {
      listContainer.innerHTML = '<div style="text-align:center; color:#94a3b8;">沒有符合條件的內容</div>';
      return;
    }

    filteredData.forEach(item => {
      const en = item.english || item.英文 || '';
      const zh = item.chinese || item.中文 || '';
      
      const div = document.createElement('div');
      div.className = 'read-item';
      div.innerHTML = `<div class="en">${en}</div><div class="zh">${zh}</div>`;
      listContainer.appendChild(div);
    });
  }

  function switchTab(tab) {
    document.getElementById('btn-tab-listen').classList.toggle('active', tab === 'listen');
    document.getElementById('btn-tab-read').classList.toggle('active', tab === 'read');
    
    document.getElementById('listenSection').classList.toggle('hidden', tab !== 'listen');
    document.getElementById('readSection').classList.toggle('hidden', tab !== 'read');

    if (tab === 'read') stopAudio();
  }

  function setDisplayMode(mode) {
    displayMode = mode;
    ['all', 'en', 'zh', 'blind'].forEach(m => {
      document.getElementById(`disp-${m}`).classList.toggle('active', m === mode);
    });
    renderCurrentSentence();
  }

  function setRepeat(times, btn) {
    repeatTimes = times;
    document.querySelectorAll('.repeat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  function speakCurrent() {
    if (filteredData.length === 0) return;
    const item = filteredData[currentIndex];
    const en = item.english || item.英文 || '';

    synth.cancel();
    utterance = new SpeechSynthesisUtterance(en);
    utterance.lang = 'en-US';

    utterance.onend = () => {
      currentRepeatCount++;
      if (currentRepeatCount < repeatTimes && isPlaying) {
        speakCurrent();
      } else if (isPlaying) {
        nextSentence(true);
      }
    };

    synth.speak(utterance);
  }

  function togglePlay() {
    if (isPlaying) {
      pauseAudio();
    } else {
      isPlaying = true;
      currentRepeatCount = 0;
      document.getElementById('playBtn').innerText = '⏸ 播放中...';
      speakCurrent();
    }
  }

  function pauseAudio() {
    isPlaying = false;
    synth.pause();
    document.getElementById('playBtn').innerText = '🔊 播放';
  }

  function stopAudio() {
    isPlaying = false;
    synth.cancel();
    currentRepeatCount = 0;
    document.getElementById('playBtn').innerText = '🔊 播放';
  }

  function nextSentence(auto = false) {
    if (filteredData.length === 0) return;
    if (currentIndex < filteredData.length - 1) {
      currentIndex++;
    } else {
      currentIndex = 0; // 循環到開頭
    }
    currentRepeatCount = 0;
    renderCurrentSentence();
    if (auto && isPlaying) speakCurrent();
  }

  function prevSentence() {
    if (filteredData.length === 0) return;
    if (currentIndex > 0) {
      currentIndex--;
    } else {
      currentIndex = filteredData.length - 1;
    }
    currentRepeatCount = 0;
    renderCurrentSentence();
    if (isPlaying) speakCurrent();
  }

  loadSheetData();
</script>

</body>
</html>
