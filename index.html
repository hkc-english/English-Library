<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英文學習資料庫</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 12px; color: #333; display: flex; justify-content: center; }
    .container { max-width: 480px; width: 100%; background: #fff; padding: 20px; border-radius: 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.05); text-align: center; }
    
    .check-box { background: #fff7ed; border: 2px solid #fdba74; border-radius: 16px; padding: 15px; margin-bottom: 20px; text-align: left; }
    .check-title { font-size: 14px; font-weight: bold; color: #c2410c; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .check-target { font-size: 15px; font-weight: bold; color: #1e293b; margin-bottom: 10px; line-height: 1.4; word-break: break-word; }
    
    h1 { font-size: 22px; color: #1e293b; margin-top: 5px; margin-bottom: 15px; display: flex; justify-content: center; align-items: center; gap: 8px; }
    
    .tab-group { display: flex; gap: 12px; margin-bottom: 15px; }
    .tab-btn { flex: 1; padding: 10px; font-size: 15px; font-weight: bold; border: 2px solid #2563eb; background: #fff; color: #2563eb; border-radius: 10px; cursor: pointer; transition: all 0.2s; }
    .tab-btn.active { background: #2563eb; color: #fff; }

    .filter-box { background: #edf2f7; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px; align-items: center; justify-content: center; }
    .search-row { display: flex; align-items: center; width: 100%; gap: 8px; }
    .filter-label { font-size: 14px; font-weight: bold; color: #1e3a8a; white-space: nowrap; }
    .search-input { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; background: #fff; width: 100%; font-weight: bold; }
    
    .type-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; margin-top: 4px; }
    .type-btn { padding: 6px; font-size: 13px; font-weight: bold; border: 1px solid #cbd5e1; background: #fff; border-radius: 6px; cursor: pointer; color: #475569; }
    .type-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }

    .card { border: 1px solid #e2e8f0; border-radius: 20px; padding: 30px 20px; margin-bottom: 20px; background: #fff; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); min-height: 160px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
    .text-en { font-size: 24px; font-weight: 700; color: #1e293b; margin-bottom: 16px; line-height: 1.4; word-break: break-word; cursor: pointer; user-select: none; width: 100%; }
    .text-zh { font-size: 16px; font-weight: 500; color: #64748b; margin-bottom: 16px; word-break: break-word; cursor: pointer; user-select: none; width: 100%; }
    .stars { color: #f59e0b; font-size: 24px; letter-spacing: 4px; cursor: pointer; user-select: none; z-index: 10; }

    .control-row { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 10px; }
    .btn { padding: 10px 16px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 4px; transition: 0.2s; }
    .btn-nav { background: #e2e8f0; color: #475569; }
    .btn-play { background: #2563eb; color: #fff; padding: 10px 24px; font-size: 15px; }
    .btn-stop { background: #ef4444; color: #fff; }

    .read-list { display: flex; flex-direction: column; gap: 10px; text-align: left; max-height: 48vh; overflow-y: auto; margin-top: 5px; padding-right: 4px; }
    .read-item { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; display: flex; justify-content: space-between; align-items: center; }
    .read-content { flex: 1; padding-right: 10px; }
    .read-item .en { font-size: 16px; font-weight: bold; color: #1e293b; margin-bottom: 4px; line-height: 1.3; word-break: break-word; }
    .read-item .zh { font-size: 14px; color: #64748b; font-weight: 500; word-break: break-word; }
    .read-item .meta { font-size: 11px; color: #94a3b8; margin-top: 6px; display: flex; gap: 12px; }

    .tag-select-container { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; max-height: 100px; overflow-y: auto; background: #fff; padding: 8px; border: 1px solid #cbd5e1; border-radius: 8px; }
    .tag-chip { padding: 4px 10px; font-size: 12px; font-weight: bold; border: 1px solid #cbd5e1; background: #f8fafc; color: #475569; border-radius: 15px; cursor: pointer; user-select: none; }
    .tag-chip.active { background: #2563eb; color: #fff; border-color: #2563eb; }

    .btn-submit-add { width: 100%; padding: 12px; background: #ea580c; color: #fff; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 8px; }
    .status-msg { color: #ef4444; font-weight: bold; font-size: 14px; margin: 15px 0; padding: 10px; background: #fef2f2; border-radius: 8px; border: 1px solid #fee2e2; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <h1>📚 英文學習資料庫</h1>

  <!-- 🎯 智慧檢核區塊 (含AI自動預測) -->
  <div id="checkSection" class="check-box hidden">
    <div class="check-title">
      <span>🎯 AI 智慧待分類檢核</span>
      <span id="checkCount" style="background: #fb923c; color: #fff; padding: 2px 8px; border-radius: 10px; font-size: 12px;">0 筆</span>
    </div>
    <div id="checkTarget" class="check-target">讀取中...</div>
    <div class="tag-select-container" id="checkTagContainer"></div>
    <button class="btn-submit-add" id="btnConfirm" onclick="confirmTag()">確認並更新標籤</button>
  </div>

  <div class="tab-group">
    <button class="tab-btn active" id="btn-tab-listen" onclick="switchTab('listen')">🎧 聽力模式</button>
    <button class="tab-btn" id="btn-tab-read" onclick="switchTab('read')">📖 閱讀模式</button>
  </div>

  <div class="filter-box">
    <div class="search-row">
      <span class="filter-label">🔍 快速搜尋：</span>
      <input type="text" id="searchInput" class="search-input" placeholder="搜尋英文、中文或分類情境..." oninput="applyFilters()">
    </div>
    
    <div class="type-grid" id="typeGroup">
      <button class="type-btn active" id="type-all" onclick="changeTypeFilter('all')">全部</button>
      <button class="type-btn" id="type-word" onclick="changeTypeFilter('單字')">單字</button>
      <button class="type-btn" id="type-phrase" onclick="changeTypeFilter('片語')">片語</button>
      <button class="type-btn" id="type-sentence" onclick="changeTypeFilter('句子')">句子</button>
    </div>
  </div>

  <div id="statusMessage" class="status-msg hidden">❌ 資料載入失敗</div>

  <!-- 聽力模式區塊 -->
  <div id="listenSection">
    <div style="font-size: 14px; color: #475569; font-weight: bold; margin-bottom: 12px; text-align: left;" id="infoText">第 -- / -- 筆</div>
    <div class="card">
      <div class="text-en" id="textEn">讀取中...</div>
      <div class="text-zh" id="textZh">--</div>
      <div class="stars" id="textStar">☆☆☆☆•</div>
    </div>
    <div class="control-row">
      <button class="btn btn-nav" onclick="prevSentence()">⬅ 上一句</button>
      <button class="btn btn-play" id="playBtn" onclick="handlePlayToggle()">🔊 播放</button>
      <button class="btn btn-stop" onclick="stopAudio()">■ 停止</button>
      <button class="btn btn-nav" onclick="nextSentence()">下一句 ➡</button>
    </div>
  </div>

  <!-- 閱讀模式區塊 -->
  <div id="readSection" class="hidden">
    <div id="dataCountText" style="font-weight: bold; color: #475569; font-size: 14px; margin-bottom: 10px; text-align: left;">共 0 筆資料</div>
    <div class="read-list" id="readList"></div>
  </div>
</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbyL3VisnFbNnt5Sj-2_78kJxAsCD49LplNAQ3CyGvQipAwG1E3-M0Ea35HzTIensStz/exec';

  let rawData = [];
  let filteredData = [];
  let pendingData = [];
  let availableTags = []; 
  let currentIndex = 0;
  let currentTab = 'listen';
  let selectedTypeFilter = 'all';

  async function loadSheetData() {
    try {
      const res = await fetch(API_URL);
      const resJson = await res.json();
      
      if (Array.isArray(resJson)) {
        rawData = resJson;
        availableTags = [];
      } else {
        rawData = resJson.data || [];
        availableTags = resJson.tags || [];
      }
      
      rawData.forEach((item, idx) => {
        let rawStar = item.熟悉度 ?? item.star ?? item.星級 ?? 1;
        item.star = isNaN(parseInt(rawStar)) ? 1 : parseInt(rawStar);
        item.originalIndex = idx;
        item.tagStr = (item['標籤(情境分類)'] || item.category || item.tags || '').toString().trim();
      });
      
      document.getElementById('statusMessage').classList.add('hidden');
      checkPendingData();
      applyFilters();
    } catch (err) {
      document.getElementById('statusMessage').classList.remove('hidden');
      console.error(err);
    }
  }

  function checkPendingData() {
    pendingData = rawData.filter(item => item.tagStr === '' || item.tagStr === '待處理' || item.tagStr.includes('待處理'));
    
    const section = document.getElementById('checkSection');
    const countEl = document.getElementById('checkCount');
    
    if (pendingData.length > 0) {
      section.classList.remove('hidden');
      countEl.innerText = `${pendingData.length} 筆`;
      renderPendingItem(pendingData[0]);
    } else {
      section.classList.add('hidden');
    }
  }

  function renderPendingItem(item) {
    const en = item.英文 || item.english || '';
    const zh = item.中文 || item.chinese || '';
    document.getElementById('checkTarget').innerText = `待確認：${en} (${zh})`;
    const container = document.getElementById('checkTagContainer');
    container.innerHTML = '';

    if (!availableTags || availableTags.length === 0) {
      container.innerHTML = '<span style="font-size: 12px; color: #94a3b8;">未偵測到標籤字典</span>';
      return;
    }

    // 呼叫 AI 預測符合的標籤
    const predicted = autoPredictTags(en.toLowerCase(), zh.toLowerCase());

    availableTags.forEach(tag => {
      const chip = document.createElement('div');
      chip.className = 'tag-chip';
      chip.innerText = tag;
      // 如果 AI 預測命中，自動加上 active 樣式
      if (predicted.has(tag)) {
        chip.classList.add('active');
      }
      chip.onclick = () => { chip.classList.toggle('active'); };
      container.appendChild(chip);
    });
  }

  function autoPredictTags(text, translated) {
    const combined = text + ' ' + translated;
    const keywordMap = {
      '生活': ['life', 'home', 'house', 'day', 'time', 'sleep', 'bed', 'food', 'eat', 'person', 'good'],
      '職場': ['work', 'job', 'office', 'boss', 'colleague', 'salary', 'meeting', 'company', 'disciplined'],
      '旅遊': ['travel', 'trip', 'tour', 'flight', 'hotel', 'luggage', 'passport'],
      '餐飲': ['eat', 'food', 'restaurant', 'hungry', 'drink', 'coffee', 'menu', 'dinner', 'lunch'],
      '購物': ['buy', 'shop', 'price', 'store', 'discount', 'mall', 'pay'],
      '交通': ['traffic', 'car', 'bus', 'train', 'subway', 'drive', 'ride'],
      '醫療': ['doctor', 'hospital', 'sick', 'medicine', 'pain', 'health', 'clinic'],
      '社交': ['party', 'friend', 'talk', 'chat', 'meet', 'hello'],
      '科技': ['phone', 'computer', 'app', 'software', 'tech', 'digital', 'screen']
    };
    let tags = new Set();
    for (let [cat, kws] of Object.entries(keywordMap)) {
      if (kws.some(kw => combined.includes(kw))) tags.add(cat);
    }
    return tags;
  }

  async function confirmTag() {
    if (pendingData.length === 0) return;
    const item = pendingData[0];
    const activeChips = document.querySelectorAll('#checkTagContainer .tag-chip.active');
    const selectedTags = Array.from(activeChips).map(c => c.innerText);
    const btn = document.getElementById('btnConfirm');
    
    btn.innerText = '更新中...';
    btn.disabled = true;

    try {
      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ 
          action: 'updateTags', 
          english: item.英文 || item.english, 
          tags: selectedTags 
        })
      });
      loadSheetData();
    } catch(e) {
      alert('更新失敗');
    } finally {
      btn.disabled = false;
      btn.innerText = '確認並更新標籤';
    }
  }

  function switchTab(tab) {
    currentTab = tab;
    document.getElementById('btn-tab-listen').classList.toggle('active', tab === 'listen');
    document.getElementById('btn-tab-read').classList.toggle('active', tab === 'read');
    document.getElementById('listenSection').classList.toggle('hidden', tab !== 'listen');
    document.getElementById('readSection').classList.toggle('hidden', tab !== 'read');
  }

  function changeTypeFilter(type) {
    selectedTypeFilter = type;
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(type === 'all' ? 'type-all' : `type-${type === '單字' ? 'word' : type === '片語' ? 'phrase' : 'sentence'}`).classList.add('active');
    applyFilters();
  }

  function applyFilters() {
    filteredData = rawData.filter(item => {
      if (selectedTypeFilter !== 'all') {
        const itemType = (item.類型 || item.type || '').trim();
        if (itemType !== selectedTypeFilter) return false;
      }
      const keyword = document.getElementById('searchInput').value.toLowerCase();
      if (keyword) {
        const en = (item.英文 || item.english || '').toLowerCase();
        const zh = (item.中文 || item.chinese || '').toLowerCase();
        const tag = (item.tagStr || '').toLowerCase();
        if (!en.includes(keyword) && !zh.includes(keyword) && !tag.includes(keyword)) return false;
      }
      return true;
    });
    currentIndex = 0;
    renderCard();
    renderReadList();
  }

  function renderCard() {
    if (filteredData.length === 0) return;
    const item = filteredData[currentIndex];
    document.getElementById('textEn').innerText = item.英文 || item.english || '';
    document.getElementById('textZh').innerText = item.中文 || item.chinese || '';
    document.getElementById('textStar').innerText = '★'.repeat(item.star) + '☆'.repeat(5 - item.star);
    document.getElementById('infoText').innerText = `第 ${currentIndex + 1} / ${filteredData.length} 筆`;
  }

  function renderReadList() {
    const listContainer = document.getElementById('readList');
    listContainer.innerHTML = '';
    document.getElementById('dataCountText').innerText = `共 ${filteredData.length} 筆資料`;
    filteredData.forEach((item, index) => {
      const en = item.英文 || item.english || '';
      const zh = item.中文 || item.chinese || '';
      const cat = item.tagStr || '待處理';
      const div = document.createElement('div');
      div.className = 'read-item';
      div.innerHTML = `<div class="read-content"><div class="en">${index + 1}. ${en}</div><div class="zh">${zh}</div><div class="meta"><span>🏷️ ${cat}</span></div></div>`;
      listContainer.appendChild(div);
    });
  }

  function nextSentence() {
    if (filteredData.length === 0) return;
    currentIndex = (currentIndex + 1) % filteredData.length;
    renderCard();
  }

  function prevSentence() {
    if (filteredData.length === 0) return;
    currentIndex = (currentIndex - 1 + filteredData.length) % filteredData.length;
    renderCard();
  }

  function handlePlayToggle() { alert('播放功能'); }
  function stopAudio() {}

  window.onload = loadSheetData;
</script>
</body>
</html>
