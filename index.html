<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>英文單字播放複習</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f7f6; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .main-card { background: white; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; padding: 25px; text-align: center; }
    .card-display { border: 1px solid #ddd; border-radius: 15px; padding: 20px; margin-bottom: 20px; }
    .star-rating { color: #ffc107; font-size: 1.5rem; margin-top: 10px; }
    .btn-group-custom .btn { border-radius: 8px; margin: 2px; }
  </style>
</head>
<body>

  <div class="main-card">
    <div class="card-display">
      <h2 id="englishText" class="fw-bold">載入中...</h2>
      <p id="chineseText" class="text-muted fs-5"></p>
      <div class="star-rating" id="starContainer"><i class="fas fa-star"></i><i class="far fa-star"></i></div>
    </div>

    <div class="row g-2 mb-3">
      <div class="col-3"><button id="btnPrev" class="btn btn-light border w-100">上一句</button></div>
      <div class="col-3"><button id="btnPlay" class="btn btn-primary w-100"><i class="fas fa-volume-up"></i></button></div>
      <div class="col-3"><button id="btnStop" class="btn btn-danger w-100"><i class="fas fa-stop"></i></button></div>
      <div class="col-3"><button id="btnNext" class="btn btn-light border w-100">下一句</button></div>
    </div>

    <!-- 設定區 -->
    <div class="btn-group w-100 mb-2" id="speedGroup">
      <button class="btn btn-outline-primary" data-val="0.7">0.7x</button>
      <button class="btn btn-outline-primary active" data-val="1.0">1.0x</button>
    </div>
    <div class="btn-group w-100" id="intervalGroup">
      <button class="btn btn-outline-secondary active" data-val="3">3秒</button>
    </div>
  </div>

  <script>
    // 【重要】請把這行引號內的網址，換成你剛從 Google 重新部署取得的 /exec 網址
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyL3VisnFbNnt5Sj-2_78kJxAsCD49LplNAQ3CyGvQipAwG1E3-M0Ea35HzTIensStz/exec"; 

    let vocabList = [];
    let currentIndex = 0;
    let currentRate = 1.0;

    async function fetchCards() {
      try {
        const response = await fetch(`${GAS_WEB_APP_URL}?action=read`);
        const result = await response.json();
        if(result.status === "success") {
          vocabList = result.data;
          displayCard();
        } else {
          throw new Error();
        }
      } catch(e) {
        document.getElementById("englishText").innerText = "連線失敗";
      }
    }

    function displayCard() {
      if(vocabList.length === 0) return;
      const item = vocabList[currentIndex];
      document.getElementById("englishText").innerText = item["英文"] || "";
      document.getElementById("chineseText").innerText = item["中文"] || "";
    }

    function speakCurrent() {
      window.speechSynthesis.cancel();
      const text = vocabList[currentIndex]["英文"];
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = currentRate;
      window.speechSynthesis.speak(u);
    }

    document.getElementById("btnPlay").onclick = speakCurrent;
    document.getElementById("btnNext").onclick = () => { currentIndex++; displayCard(); speakCurrent(); };
    document.getElementById("btnPrev").onclick = () => { currentIndex--; displayCard(); speakCurrent(); };
    document.getElementById("btnStop").onclick = () => window.speechSynthesis.cancel();
    
    fetchCards();
  </script>
</body>
</html>
