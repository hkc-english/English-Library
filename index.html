<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的英文學習庫</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .card { border: none; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .star-rating { color: #ffc107; cursor: pointer; font-size: 1.2rem; }
    .star-rating .far { color: #e4e5e9; }
    .badge-custom { background-color: #e3f2fd; color: #0d6efd; font-weight: 500; }
    .loading-spinner { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; }
  </style>
</head>
<body>

  <div class="container py-4">
    <header class="text-center mb-4">
      <h1 class="fw-bold text-primary"><i class="fas fa-book-open me-2"></i>英文單字片語庫</h1>
      <p class="text-muted">隨時記錄，智慧分類，輕鬆複習</p>
    </header>

    <!-- 輸入區塊 -->
    <div class="card p-4 mb-4">
      <h5 class="card-title mb-3 fw-bold"><i class="fas fa-plus-circle text-success me-2"></i>快速新增</h5>
      <form id="vocabForm">
        <div class="row g-3">
          <div class="col-md-5">
            <input type="text" id="englishInput" class="form-control" placeholder="輸入英文單字或句子 (例如: Apple)" required autocomplete="off">
          </div>
          <div class="col-md-4">
            <input type="text" id="chineseInput" class="form-control" placeholder="中文翻譯 (可留空，由系統預判)" autocomplete="off">
          </div>
          <div class="col-md-3">
            <button type="submit" class="btn btn-primary w-100 fw-bold"><i class="fas fa-paper-plane me-1"></i>送出</button>
          </div>
        </div>
      </form>
    </div>

    <!-- 列表與篩選區塊 -->
    <div class="card p-4">
      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h5 class="fw-bold mb-0"><i class="fas fa-list text-info me-2"></i>單字列表</h5>
        <div class="d-flex gap-2">
          <select id="filterCategory" class="form-select form-select-sm" style="width: 130px;">
            <option value="all">所有情境</option>
          </select>
          <select id="filterType" class="form-select form-select-sm" style="width: 110px;">
            <option value="all">所有類型</option>
            <option value="單字">單字</option>
            <option value="片語">片語</option>
            <option value="句子">句子</option>
          </select>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th style="width: 8%;">ID</th>
              <th style="width: 25%;">英文</th>
              <th style="width: 25%;">中文</th>
              <th style="width: 10%;">類型</th>
              <th style="width: 12%;">熟悉度</th>
              <th style="width: 10%;">情境標籤</th>
            </tr>
          </thead>
          <tbody id="vocabTableBody">
            <tr>
              <td colspan="6" class="text-center text-muted py-4">資料載入中...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 智慧引導確認彈窗 (Modal) -->
  <div class="modal fade" id="predictModal" data-bs-backdrop="static" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="border-radius: 15px;">
        <div class="modal-header bg-light">
          <h5 class="modal-title fw-bold text-primary"><i class="fas fa-magic me-2"></i>AI 智慧引導確認</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-content p-4 border-0">
          <div class="mb-3">
            <label class="form-label fw-bold text-muted small">您輸入的英文</label>
            <div id="modalEnglish" class="p-2 bg-light rounded fw-semibold text-dark"></div>
          </div>
          <div class="mb-3">
            <label for="modalChinese" class="form-label fw-bold">中文翻譯確認</label>
            <input type="text" id="modalChinese" class="form-control form-control-lg" placeholder="請輸入或修正中文翻譯">
          </div>
          <div class="row mb-3">
            <div class="col-6">
              <label for="modalType" class="form-label fw-bold small">類型預判</label>
              <select id="modalType" class="form-select">
                <option value="單字">單字</option>
                <option value="片語">片語</option>
                <option value="句子">句子</option>
              </select>
            </div>
            <div class="col-6">
              <label for="modalCategory" class="form-label fw-bold small">情境分類</label>
              <input type="text" id="modalCategory" class="form-control" placeholder="例如: 職場、棒球">
            </div>
          </div>
          <button type="button" id="btnConfirmSubmit" class="btn btn-success w-100 btn-lg fw-bold mt-2">
            <i class="fas fa-check-circle me-1"></i>確認並寫入試算表
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 全域讀取圈圈 -->
  <div id="loadingSpinner" class="loading-spinner">
    <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
  <script>
    // 💡 請將下方 URL 替換為您部署好的最新 Google Apps Script 網頁應用程式網址
    const GAS_WEB_APP_URL = "您的GAS部署網址"; 

    let dbData = [];
    const predictModal = new bootstrap.Modal(document.getElementById('predictModal'));

    // 關鍵字字典配置 (可自行擴增)
    const keywordRules = [
      { keywords: ['baseball', 'game', 'pitcher', 'homerun', 'team'], type: '句子', category: '棒球' },
      { keywords: ['cat', 'kitten', 'meow', 'vet', 'feline'], type: '單字', category: '貓咪' },
      { keywords: ['meeting', 'budget', 'report', 'office', 'manager'], type: '單字', category: '職場' }
    ];

    document.addEventListener("DOMContentLoaded", () => {
      fetchData();
      
      document.getElementById("vocabForm").addEventListener("submit", (e) => {
        e.preventDefault();
        handleFormSubmit();
      });

      document.getElementById("btnConfirmSubmit").addEventListener("click", () => {
        submitToGoogleSheet();
      });

      document.getElementById("filterCategory").addEventListener("change", renderTable);
      document.getElementById("filterType").addEventListener("change", renderTable);
    });

    // 取得資料
    function fetchData() {
      showLoading(true);
      fetch(`${GAS_WEB_APP_URL}?action=read`)
        .then(res => res.json())
        .then(res => {
          if(res.status === "success") {
            dbData = res.data || [];
            updateFilterOptions();
            renderTable();
          } else {
            alert("讀取失敗：" + res.message);
          }
        })
        .catch(err => {
          console.error(err);
          alert("無法連線至 Google 試算表，請檢查網路或 GAS 網址。");
        })
        .finally(() => showLoading(false));
    }

    // 智慧預判邏輯
    function handleFormSubmit() {
      const english = document.getElementById("englishInput").value.trim();
      const chinese = document.getElementById("chineseInput").value.trim();

      if (!english) return;

      // 1. 自動判斷類型 (依據空格數基本劃分，若有精準關鍵字會再覆寫)
      let predictedType = "單字";
      const spaceCount = english.split(/\s+/).filter(Boolean).length;
      if (spaceCount === 2 || spaceCount === 3) predictedType = "片語";
      if (spaceCount > 3) predictedType = "句子";

      // 2. 自動判斷情境標籤
      let predictedCategory = "通用";
      const lowerEnglish = english.toLowerCase();
      
      for (const rule of keywordRules) {
        const match = rule.keywords.some(kw => lowerEnglish.includes(kw));
        if (match) {
          predictedCategory = rule.category;
          // 如果包含關鍵字且空格多，維持句子；若少，則採用規則定義的預設類型
          if (spaceCount <= 3) predictedType = rule.type;
          break;
        }
      }

      // 3. 填入彈窗欄位
      document.getElementById("modalEnglish").innerText = english;
      document.getElementById("modalChinese").value = chinese; // 有手打就帶入，沒手打就保持空白讓使用者填
      document.getElementById("modalType").value = predictedType;
      document.getElementById("modalCategory").value = predictedCategory;

      predictModal.hide();
      predictModal.show();
    }

    // 正式送出到試算表
    function submitToGoogleSheet() {
      const english = document.getElementById("modalEnglish").innerText.trim();
      let chinese = document.getElementById("modalChinese").value.trim();
      const type = document.getElementById("modalType").value;
      const category = document.getElementById("modalCategory").value.trim() || "通用";

      if (!chinese) {
        alert("請輸入中文翻譯再送出喔！");
        return;
      }

      predictModal.hide();
      showLoading(true);

      const payload = {
        action: "addEnglish",
        english: english,
        chinese: chinese,
        type: type,
        category: category,
        star: 1 // 💡 前端預設直接給 1 星
      };

      // 設定逾時機制 (5秒)，防止網路塞車時網頁無限卡死
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 5000);

      fetch(GAS_WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify(payload),
        signal: controller.signal
      })
      .then(res => res.json())
      .then(res => {
        clearTimeout(timeoutId);
        if (res.status === "success") {
          // 清空主輸入框
          document.getElementById("englishInput").value = "";
          document.getElementById("chineseInput").value = "";
          fetchData(); // 重新整理
        } else {
          alert("寫入失敗：" + res.message);
        }
      })
      .catch(err => {
        clearTimeout(timeoutId);
        console.warn("連線異常，啟動在地防呆備用機制", err);
        
        // 💡 斷線防護機制：如果連線斷開，前端直接假擬一筆寫入本機畫面，且強制作為 1 星，不讓介面空白
        const fallbackId = dbData.length > 0 ? Math.max(...dbData.map(d => parseInt(d.ID) || 0)) + 1 : 1;
        const fallbackItem = {
          "ID": fallbackId,
          "英文": english,
          "中文": `（連線異常，已自動寫入）${chinese}`,
          "類型": type,
          "熟悉度": 1, // 💡 強制補 1
          "標籤(情境分類)": category,
          "建立日期": new Date().toISOString().slice(0,10)
        };
        dbData.unshift(fallbackItem); 
        renderTable();
        alert("偵測到網路連線異常，已先將資料暫存至本地列表，請檢查您的 Google 試算表內是否有正常排進去喔！");
      })
      .finally(() => showLoading(false));
    }

    // 更新星級熟悉度
    function updateStarRating(id, newStar) {
      showLoading(true);
      fetch(GAS_WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "updateStar",
          id: id,
          star: newStar
        })
      })
      .then(res => res.json())
      .then(res => {
        if (res.status === "success") {
          // 在地直接更新狀態，免去重新載入整張表的時間
          const item = dbData.find(d => parseInt(d.ID) === parseInt(id));
          if(item) item["熟悉度"] = newStar;
          renderTable();
        } else {
          alert("更新星級失敗：" + res.message);
        }
      })
      .catch(err => {
        console.error(err);
        alert("網路連線失敗，無法更新星級。");
      })
      .finally(() => showLoading(false));
    }

    // 更新篩選下拉選單內容
    function updateFilterOptions() {
      const catSelect = document.getElementById("filterCategory");
      const categories = new Set(["all"]);
      
      dbData.forEach(item => {
        const cat = item["標籤(情境分類)"] || item["標籤"] || "通用";
        categories.add(cat);
      });
      
      catSelect.innerHTML = "";
      categories.forEach(cat => {
        const opt = document.createElement("option");
        opt.value = cat;
        opt.innerText = cat === "all" ? "所有情境" : cat;
        catSelect.appendChild(opt);
      });
    }

    // 渲染表格資料
    function renderTable() {
      const tbody = document.getElementById("vocabTableBody");
      const filterCat = document.getElementById("filterCategory").value;
      const filterType = document.getElementById("filterType").value;
      
      tbody.innerHTML = "";

      // 將資料倒序排列（最新發生的顯示在最上面）
      const filteredData = dbData.filter(item => {
        const cat = item["標籤(情境分類)"] || item["標籤"] || "通用";
        const type = item["類型"] || "單字";
        
        const matchCat = (filterCat === "all" || cat === filterCat);
        const matchType = (filterType === "all" || type === filterType);
        return matchCat && matchType;
      });

      if (filteredData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-3">沒有符合條件的資料</td></tr>`;
        return;
      }

      filteredData.forEach(item => {
        const id = item["ID"];
        const english = item["英文"] || "";
        const chinese = item["中文"] || "";
        const type = item["類型"] || "單字";
        const category = item["標籤(情境分類)"] || item["標籤"] || "通用";
        
        // 💡 核心防呆：如果撈回來的熟悉度是空字串、undefined 或 <= 0，網頁前端一律自動補為 1 星
        let rawStar = item["熟悉度"] !== undefined ? item["熟悉度"] : 1;
        let starVal = parseInt(rawStar);
        if (isNaN(starVal) || starVal <= 0) {
          starVal = 1;
        }

        // 產生星星的 HTML
        let starHtml = `<div class="star-rating" data-id="${id}">`;
        for (let i = 1; i <= 5; i++) {
          if (i <= starVal) {
            starHtml += `<i class="fas fa-star" onclick="updateStarRating(${id}, ${i})"></i>`;
          } else {
            starHtml += `<i class="far fa-star" onclick="updateStarRating(${id}, ${i})"></i>`;
          }
        }
        starHtml += `</div>`;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><span class="text-secondary small">${id}</span></td>
          <td class="fw-semibold text-dark">${english}</td>
          <td>${chinese}</td>
          <td><span class="badge bg-light text-secondary border">${type}</span></td>
          <td>${starHtml}</td>
          <td><span class="badge badge-custom">${category}</span></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function showLoading(show) {
      document.getElementById("loadingSpinner").style.display = show ? "block" : "none";
    }
  </script>
</body>
</html>
